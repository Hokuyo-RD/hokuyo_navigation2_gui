{% extends 'layout.html' %}

{% block title %}
wizurg_setting
{% endblock %}

{% block header %}
<h1>WizURG操作画面</h1>
{% endblock header %}

{% block content %}
<div class="index-page-container">
    <div id="status-display" style="font-size: 1.2em; margin-bottom: 20px;">現在のモード: 未設定</div>
    
    <button id="indoorRunBtn" class="mode-control-btn">屋内自律走行設定</button>
    <button id="outdoorRunBtn" class="mode-control-btn">屋外自律走行設定</button>
    <form method="post" action="/wizurg" target="_blank">
        <button type="submit" name="command" value="stop" id="stop">ロボット停止</button>
    </form>
    <form method="post" action="/wizurg" target="_blank">
        <button type="submit" name="command" value="map">マップ</button>
    </form>
    <form method="post" action="/wizurg" target="_blank">
        <button type="submit" name="command" value="demo" id="demo" class="mode-control-btn">手動操作モード</button>
    </form>
    <br>
    <a href="http://100.99.252.7:5000/" target="_blank" >自律走行経路確認Viewer</a>
    <div id="indoorPopupContainer" class="popup-container">
        <div id="indoorPopupContent" class="popup-content">
            <button id="closeIndoorPopupBtn" class="close-button">閉じる</button>
            <div id="indoorRunContent">
            </div>
        </div>
    </div>
    <div id="outdoorPopupContainer" class="popup-container" style="display: none;">
        <div id="outdoorPopupContent" class="popup-content">
            <button id="closeOutdoorPopupBtn" class="close-button">閉じる</button>
            <div id="outdoorRunContent">
            </div>
        </div>
    </div>
</div>

<script>
    const reloadChannel = new BroadcastChannel('reloadIndexPageChannel');
    const indoorRunBtn = document.getElementById('indoorRunBtn');
    const outdoorRunBtn = document.getElementById('outdoorRunBtn');
    const indoorPopupContainer = document.getElementById('indoorPopupContainer');
    const indoorRunContent = document.getElementById('indoorRunContent');
    const closeIndoorPopupBtn = document.getElementById('closeIndoorPopupBtn');
    const outdoorPopupContainer = document.getElementById('outdoorPopupContainer');
    const outdoorRunContent = document.getElementById('outdoorRunContent');
    const closeOutdoorPopupBtn = document.getElementById('closeOutdoorPopupBtn');
    
    const statusDisplay = document.getElementById('status-display');
    const modeControlBtns = document.querySelectorAll('.mode-control-btn');
    const stopBtn = document.getElementById('stop');
    const demoBtn = document.getElementById('demo');

    function initializeCheckboxes(container) {
        const checkboxes = container.querySelectorAll('input[type="checkbox"]');
        const executeBtn = container.querySelector('button[type="submit"]');

        function updateExecuteButtonState() {
            if (!executeBtn) return;
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            executeBtn.disabled = !allChecked;
            if (allChecked) {
                executeBtn.classList.remove('inactive-button');
                executeBtn.classList.add('active-button');
            } else {
                executeBtn.classList.add('inactive-button');
                executeBtn.classList.remove('active-button');
            }
        }

        checkboxes.forEach(cb => {
            cb.addEventListener('change', updateExecuteButtonState);
        });

        const form = container.querySelector('form');
        if (form) {
            form.addEventListener('submit', (event) => {
                const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                if (!allChecked) {
                    event.preventDefault();
                    alert('すべてのチェック項目にチェックを入れてください。');
                }
            });
        }
        updateExecuteButtonState();
    }

    reloadChannel.onmessage = function(event) {
        if (event.data && event.data.action === 'reload') {
            window.location.reload();
        }
    };

    function updateButtonState(mode) {
        if (mode === 'running' || mode === 'demo') {
            modeControlBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('inactive-button');
            });
            if (stopBtn) {
                stopBtn.disabled = false;
                stopBtn.classList.remove('inactive-button');
            }
        } else {
            modeControlBtns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('inactive-button');
            });
        }
    }

    function updateStatusDisplay(mode) {
        let message;
        switch(mode) {
            case 'running':
                message = "自律走行モード";
                break;
            case 'demo':
                message = "手動操作モード";
                break;
            case 'stopped':
                message = "停止モード";
                break;
            default:
                message = "サーバ接続なし";
        }
        statusDisplay.textContent = `現在のモード: ${message}`;
        updateButtonState(mode);
    }
    
    function refreshModeStatus() {
        fetch('/get_mode')
            .then(response => response.json())
            .then(data => {
                updateStatusDisplay(data.mode);
            })
            .catch(error => {
                console.error('Error fetching mode:', error);
                updateStatusDisplay('unknown');
            });
    }

    window.onload = function() {
        refreshModeStatus();
        setInterval(refreshModeStatus, 5000);
    };

    function updateButtonState(mode) {
        if (mode === 'running' || mode === 'demo') {
            modeControlBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('inactive-button');
            });
            if (stopBtn) {
                stopBtn.disabled = false;
                stopBtn.classList.remove('inactive-button');
            }
        } else {
            modeControlBtns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('inactive-button');
            });
        }
    }

    function updateStatusDisplay(mode) {
        let message;
        switch(mode) {
            case 'running':
                message = "自律走行モード";
                break;
            case 'demo':
                message = "手動操作モード";
                break;
            case 'stopped':
                message = "停止モード";
                break;
            default:
                message = "未設定";
        }
        statusDisplay.textContent = `現在のモード: ${message}`;
        updateButtonState(mode);
    }
    
    function refreshModeStatus() {
        fetch('/get_mode')
            .then(response => response.json())
            .then(data => {
                updateStatusDisplay(data.mode);
            })
            .catch(error => {
                console.error('Error fetching mode:', error);
                updateStatusDisplay('unknown');
            });
    }

    window.onload = function() {
        refreshModeStatus();
        setInterval(refreshModeStatus, 5000);
    };

    indoorRunBtn.addEventListener('click', () => {
        fetch('/indoor_run_popup')
            .then(response => response.text())
            .then(data => {
                indoorRunContent.innerHTML = data;
                initializeCheckboxes(indoorRunContent);
                indoorPopupContainer.style.display = 'flex';
            })
            .catch(error => {
                console.error('Error fetching indoor_run.html:', error);
                alert('屋内自律走行設定の読み込みに失敗しました。');
            });
    });

    outdoorRunBtn.addEventListener('click', () => {
        fetch('/outdoor_run_popup')
            .then(response => response.text())
            .then(data => {
                outdoorRunContent.innerHTML = data;
                initializeCheckboxes(outdoorRunContent);
                outdoorPopupContainer.style.display = 'flex';
            })
            .catch(error => {
                console.error('Error fetching outdoor_run_popup.html:', error);
                alert('屋外自律走行設定の読み込みに失敗しました。');
            });
    });

    closeIndoorPopupBtn.addEventListener('click', () => {
        indoorPopupContainer.style.display = 'none';
        indoorRunContent.innerHTML = '';
    });

    closeOutdoorPopupBtn.addEventListener('click', () => {
        outdoorPopupContainer.style.display = 'none';
        outdoorRunContent.innerHTML = '';
    });

    indoorPopupContainer.addEventListener('click', (event) => {
        if (event.target === indoorPopupContainer) {
            indoorPopupContainer.style.display = 'none';
            indoorRunContent.innerHTML = '';
        }
    });

    outdoorPopupContainer.addEventListener('click', (event) => {
        if (event.target === outdoorPopupContainer) {
            outdoorPopupContainer.style.display = 'none';
            outdoorRunContent.innerHTML = '';
        }
    });
</script>
{% endblock %}

{% block footer %}
index_footer
{% endblock %}
