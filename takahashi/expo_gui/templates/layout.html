<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock  %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='/hokuyo.png') }}" type="image/png">
</head>

<body>
    <div class="header">
        {% block header %}{% endblock  %}
    </div>
    <div class="content">
        <h1>{% block content %}{% endblock  %}</h1>
    </div>
    <div class="footer">
        {% block footer %}{% endblock  %}
    </div>
</body>

</html>
