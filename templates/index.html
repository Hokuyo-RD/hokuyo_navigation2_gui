{% extends 'layout.html' %}

{% block title %}
hokuyo_nav2_gui
{% endblock %}

{% block header %}
<h1>hokuyo_nav2_gui</h1>
{% endblock header %}

{% block content %}
<div class="index-page-container">
    <div id="status-display" style="font-size: 1.2em; margin-bottom: 20px;">現在のモード: 未設定</div>
    <form method="post" action="/gui" target="_blank">
        <button type="submit" name="command" value="ctrl" id="ctrl" class="mode-control-btn">データ取得</button>
    </form>
    <button id="mappingBtn" class="mode-control-btn">マッピング</button>
    <button id="navigationRunBtn" class="mode-control-btn">自律走行</button>
    <button id="fileManagementBtn" class="mode-control-btn">ファイル管理</button>
    
    <form method="post" action="/gui" target="_blank">
        <button type="submit" name="command" value="stop" id="stop">ロボット停止</button>
    </form>
    <form method="get" action="/map_viewer" target="_blank">
        <button type="submit" name="command" value="map_viewer" id="map_viewer">Map Viewer</button>
    </form>
    <br>
    <a href="http://{{ viewer_host }}:5000/" target="_blank" >自律走行経路確認Viewer</a>

    <div id="navigationPopupContainer" class="popup-container" style="display: none;">
        <div id="navigationPopupContent" class="popup-content">
            <button id="closenavigationPopupBtn" class="close-button">閉じる</button>
            <div id="navigationRunContent">
            </div>
        </div>
    </div>
    
    <div id="mappingPopupContainer" class="popup-container" style="display: none;">
        <div id="mappingPopupContent" class="popup-content">
            <button id="closeMappingPopupBtn" class="close-button">閉じる</button>
            <div id="mappingRunContent">
            </div>
        </div>
    </div>

    <div id="fileManagementPopupContainer" class="popup-container" style="display: none;">
        <div id="fileManagementPopupContent" class="popup-content">
            <button id="closeFileManagementPopupBtn" class="close-button">閉じる</button>
            <div id="fileManagementRunContent">
            </div>
        </div>
    </div>
</div>

<script>
    const reloadChannel = new BroadcastChannel('reloadIndexPageChannel');
    const navigationRunBtn = document.getElementById('navigationRunBtn');
    const mappingBtn = document.getElementById('mappingBtn');
    const fileManagementBtn = document.getElementById('fileManagementBtn');

    const navigationPopupContainer = document.getElementById('navigationPopupContainer');
    const navigationRunContent = document.getElementById('navigationRunContent');
    const closenavigationPopupBtn = document.getElementById('closenavigationPopupBtn');
    
    const mappingPopupContainer = document.getElementById('mappingPopupContainer');
    const mappingRunContent = document.getElementById('mappingRunContent');
    const closeMappingPopupBtn = document.getElementById('closeMappingPopupBtn');

    const fileManagementPopupContainer = document.getElementById('fileManagementPopupContainer');
    const fileManagementRunContent = document.getElementById('fileManagementRunContent');
    const closeFileManagementPopupBtn = document.getElementById('closeFileManagementPopupBtn');
    
    const statusDisplay = document.getElementById('status-display');
    const modeControlBtns = document.querySelectorAll('.mode-control-btn');
    const stopBtn = document.getElementById('stop');
    const ctrlBtn = document.getElementById('ctrl');

    function initializeCheckboxes(container) {
        const checkboxes = container.querySelectorAll('input[type="checkbox"]');
        // 実行ボタンが複数ある場合に対応
        const executeBtns = container.querySelectorAll('button[type="submit"]');

        function updateExecuteButtonState() {
            if (executeBtns.length === 0) return;
            const hasCheckboxes = checkboxes.length > 0;
            if (!hasCheckboxes) return; 

            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            
            executeBtns.forEach(btn => {
                btn.disabled = !allChecked;
                if (allChecked) {
                    btn.classList.remove('inactive-button');
                    btn.classList.add('active-button');
                } else {
                    btn.classList.add('inactive-button');
                    btn.classList.remove('active-button');
                }
            });
        }

        checkboxes.forEach(cb => {
            cb.addEventListener('change', updateExecuteButtonState);
        });

        const form = container.querySelector('form');
        if (form) {
            form.addEventListener('submit', (event) => {
                const hasCheckboxes = checkboxes.length > 0;
                if (hasCheckboxes) {
                    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                    if (!allChecked) {
                        event.preventDefault();
                        alert('すべてのチェック項目にチェックを入れてください。');
                    }
                }
            });
        }
        updateExecuteButtonState();
    }

    reloadChannel.onmessage = function(event) {
        if (event.data && event.data.action === 'reload') {
            window.location.reload();
        }
    };

    function updateButtonState(mode) {
        if (mode === 'running' || mode === 'ctrl' || mode === 'mapping') {
            // メイン画面のモード選択ボタンを無効化
            navigationRunBtn.disabled = true;
            navigationRunBtn.classList.add('inactive-button');
            mappingBtn.disabled = true;
            mappingBtn.classList.add('inactive-button');
            fileManagementBtn.disabled = true;
            fileManagementBtn.classList.add('inactive-button');
            ctrlBtn.disabled = true;
            ctrlBtn.classList.add('inactive-button');

            if (stopBtn) {
                stopBtn.disabled = false;
                stopBtn.classList.remove('inactive-button');
            }
        } else {
            // 停止モードの場合、すべてのボタンを有効化
            navigationRunBtn.disabled = false;
            navigationRunBtn.classList.remove('inactive-button');
            mappingBtn.disabled = false;
            mappingBtn.classList.remove('inactive-button');
            fileManagementBtn.disabled = false;
            fileManagementBtn.classList.remove('inactive-button');
            ctrlBtn.disabled = false;
            ctrlBtn.classList.remove('inactive-button');
            
            if (stopBtn) {
                stopBtn.disabled = false; 
                stopBtn.classList.remove('inactive-button');
            }
        }
    }

    function updateStatusDisplay(mode) {
        let message;
        switch(mode) {
            case 'running':
                message = "自律走行モード";
                break;
            case 'ctrl':
                message = "手動操作モード";
                break;
            case 'mapping':
                message = "マッピングモード";
                break;
            case 'stopped':
                message = "停止モード";
                break;
            default:
                message = "サーバ接続なし";
        }
        statusDisplay.textContent = `現在のモード: ${message}`;
        updateButtonState(mode);
    }
    
    function refreshModeStatus() {
        fetch('/get_mode')
            .then(response => response.json())
            .then(data => {
                updateStatusDisplay(data.mode);
            })
            .catch(error => {
                console.error('Error fetching mode:', error);
                updateStatusDisplay('unknown');
            });
    }

    window.onload = function() {
        refreshModeStatus();
        setInterval(refreshModeStatus, 5000);
    };

    navigationRunBtn.addEventListener('click', () => {
        fetch('/navigation_run_popup')
            .then(response => response.text())
            .then(data => {
                navigationRunContent.innerHTML = data;
                
                // ポップアップ内の要素を取得してイベントリスナーを設定
                const container = navigationRunContent;
                const argumentsSelect = container.querySelector('#arguments');
                const additionalFields = container.querySelector('#additional-fields');
                const multiMapField = container.querySelector('#multi-map-field');

                function toggleAdditionalFields() {
                    if (!argumentsSelect || !additionalFields || !multiMapField) return;
                    const selectedValue = argumentsSelect.value;
                    if (selectedValue === 'single_map_gnss' || selectedValue === 'single_map_loc') {
                        additionalFields.style.display = 'block';
                        multiMapField.style.display = 'none';
                    } else if (selectedValue === 'multi_map') {
                        additionalFields.style.display = 'none';
                        multiMapField.style.display = 'block';
                    } else {
                        additionalFields.style.display = 'none';
                        multiMapField.style.display = 'none';
                    }
                }

                if (argumentsSelect) {
                    argumentsSelect.addEventListener('change', toggleAdditionalFields);
                    toggleAdditionalFields(); // 初期表示を更新
                }
                initializeCheckboxes(container); // 既存のチェックボックス初期化
                navigationPopupContainer.style.display = 'flex';
            })
            .catch(error => {
                console.error('Error fetching navigation_run_popup.html:', error);
                alert('屋外自律走行設定の読み込みに失敗しました。');
            });
    });
    
    mappingBtn.addEventListener('click', () => {
        fetch('/mapping_popup')
            .then(response => response.text())
            .then(data => {
                mappingRunContent.innerHTML = data;
                mappingPopupContainer.style.display = 'flex';

                // ポップアップ内のトグルスイッチのイベントリスナーをここで設定
                const advancedToggle = mappingRunContent.querySelector('#advanced-toggle');
                if (advancedToggle) {
                    advancedToggle.addEventListener('change', function() {
                        const advancedFeatures = mappingRunContent.querySelector('#advanced-features');
                        if (advancedFeatures) {
                            advancedFeatures.style.display = this.checked ? 'flex' : 'none';
                        }
                    });
                }
            })
            .catch(error => {
                console.error('Error fetching mapping_popup.html:', error);
                alert('マッピング設定の読み込みに失敗しました。');
            });
    });

    fileManagementBtn.addEventListener('click', () => {
        fetch('/file_management_popup')
            .then(response => response.text())
            .then(data => {
                fileManagementRunContent.innerHTML = data;
                fileManagementPopupContainer.style.display = 'flex';
            })
            .catch(error => {
                console.error('Error fetching file_management_popup.html:', error);
                alert('ファイル管理設定の読み込みに失敗しました。');
            });
    });


    closenavigationPopupBtn.addEventListener('click', () => {
        navigationPopupContainer.style.display = 'none';
        navigationRunContent.innerHTML = '';
    });
    
    closeMappingPopupBtn.addEventListener('click', () => {
        mappingPopupContainer.style.display = 'none';
        mappingRunContent.innerHTML = '';
    });

    closeFileManagementPopupBtn.addEventListener('click', () => {
        fileManagementPopupContainer.style.display = 'none';
        fileManagementRunContent.innerHTML = '';
    });

    navigationPopupContainer.addEventListener('click', (event) => {
        if (event.target === navigationPopupContainer) {
            navigationPopupContainer.style.display = 'none';
            navigationRunContent.innerHTML = '';
        }
    });
    
    mappingPopupContainer.addEventListener('click', (event) => {
        if (event.target === mappingPopupContainer) {
            mappingPopupContainer.style.display = 'none';
            mappingRunContent.innerHTML = '';
        }
    });

    fileManagementPopupContainer.addEventListener('click', (event) => {
        if (event.target === fileManagementPopupContainer) {
            fileManagementPopupContainer.style.display = 'none';
            fileManagementRunContent.innerHTML = '';
        }
    });
</script>
{% endblock %}

{% block footer %}
HOKUYO AUTOMATIC CO., LTD.
{% endblock %}
