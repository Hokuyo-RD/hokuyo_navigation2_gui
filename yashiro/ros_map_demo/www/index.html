<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="author" content="Tatsuya Okamoto" />
    <meta name="description" content="万博mapデモ." />

    <title>万博mapデモ</title>
    <meta name="stylesheet" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css" />

    <!-- leaflet用CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./css/leaflet_styles.css">

    <!-- アラーム用CSS -->
    <link rel="stylesheet" href="./css/AlertLamp.css">

    <!-- ウィジェット用CSS -->
    <link rel="stylesheet" href="./css/Widgets.css">

    <!-- leaflet用JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet-Rotate -->
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

    <!-- Leaflet-アイコン回転 -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker"></script>

    <!--座標変換ライブラリproj4js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.10.0/proj4.js"
        integrity="sha512-e3rsOu6v8lmVnZylXpOq3DO/UxrCgoEMqosQxGygrgHlves9HTwQzVQ/dLO+nwSbOSAecjRD7Y/c4onmiBVo6w=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!--日本座標系の追加用スクリプト-->
    <script src="./js/japanege_EPSG.js"></script>
    <!--UTM座標系の追加用スクリプト-->
    <script src="./js/UTM_EPSG.js"></script>

    <!--three.js 関連の読み込み-->
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/PCDLoader.js"></script>

    <!--javascriptの読み込み-->
    <script src="./js/three_test.js"></script>
    <script src="./js/AlertScript.js"></script>
    <script src="./js/GenerateTileGroup.js"></script>


    <!--roslibjs-->
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>

    <!--rosから緯度経度を取得してピンを立てるだけのスクリプト-->
    <script src="./js/ROS_fix_marker.js"></script>

</head>

<body>
    <div id="mapid"></div>
    <img id="dragIcon" class="drag-icon" src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" width="25"
        height="41" />


    <div class="widget title">
        <ul id="flex">
            <li><img id="h_logo" src=https://www.hokuyo-aut.co.jp/assets/img/common/h_logo.png> </li>
            <li>　　　<img id="h_logo" src="" alt="QRコード"> </li>
        </ul>
    </div>

    <div class="widget toolBar">
        <details class="accordion">
            <summary>表示切替</summary>
            <div class="iconButton">
                <ul>
                    <li><input type="checkbox" checked id="self_position" name="scales" checked
                            onclick="changeGPSMarkerVisible(this.checked)" />
                        <label for="self_position">
                            <img src="https://esm.sh/leaflet@1.9.2/dist/images/marker-icon.png" alt="アイコン1">
                            　自己位置
                        </label>
                    </li>

                    <li><input type="checkbox" checked id="stray" name="scales" checked
                            onclick="stray_control.visibleChanged(this.checked)" />
                        <label for="stray">
                            <img src="https://esm.sh/leaflet@1.9.2/dist/images/marker-icon.png" alt="アイコン2">
                            　迷子検知
                        </label>
                    </li>

                    <li><input type="checkbox" checked id="lost_property" name="scales" checked
                            onclick="lost_prop_control.visibleChanged(this.checked)" />
                        <label for="lost_property">
                            <img src="https://esm.sh/leaflet@1.9.2/dist/images/marker-icon.png" alt="アイコン2">
                            　落とし物検知
                        </label>
                    </li>

                    <li><input type="checkbox" checked id="congestion_level" name="scales" checked
                            onclick="konzatu_control.visibleChanged(this.checked)" />
                        <label for="congestion_level">
                            <img src="Image/sankakuIcon.png" alt="アイコン2">
                            　混雑度検知
                        </label>
                    </li>
                </ul>
            </div>
        </details>

        <details class="accordion">
            <summary>視点切替</summary>
            <div class="iconButton">
                <ul>
                    <li><input type="checkbox" checked id="rotationSwitch" name="scales" checked
                            onclick="rotationSwitch()" />
                        <label for="rotationSwitch">
                            <!-- <img src="https://esm.sh/leaflet@1.9.2/dist/images/marker-icon.png" alt="アイコン2"> -->
                            ロボット視点
                        </label>
                    </li>
                </ul>
            </div>
        </details>

        <details class="accordion">
            <summary>自立移動設定</summary>
            <div class="iconButton">
                <ul>
                    <li><a class="normalButton" id="expoWayPointButton"><input type="button"  name="scales" />
                            <label for="expoWayPoint">
                                <!-- <img src="https://esm.sh/leaflet@1.9.2/dist/images/marker-icon.png" alt="アイコン2"> -->
                                ウェイポイント送信
                            </label></a>
                    </li>
                </ul>
            </div>
        </details>
        </aside>
    </div>

    <dialog id="modalDialog" class="widget dialog">
        <div id="dialog-container">
            <div class="modal-message" id="modalMessage">

                本当に削除しますか？

              </div>
              <div class="modal-buttons">
                <button class="okButton" id="okButton">OK</button>
                <button class="closeButton" id="closeButton">キャンセル</button>
        </div>
    </dialog>

    <div class="widget alarm">
        <ul>
            <li>接近注意　<div class="alert approach"></div>
            </li>
            <li>アラーム2　<div class="alert alert2"></div>
            </li>
            <li>アラーム3　<div class="alert alert3"></div>
            </li>
        </ul>
    </div>


    <!--地図作成スクリプト-->
    <script src="./js/leaflet_script.js"></script>

    <script src="./js/wayPointScript.js"></script>
</body>

</html>
