<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PCD / PGM Map / Waypoint Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; color: #e0e0e0; }
        #viewer-container { width: 100vw; height: 100vh; position: relative; }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5em;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 100;
            transition: opacity 0.3s;
        }
        .add-waypoint-mode {
            cursor: crosshair;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
            z-index: 10;
        }
        #grid-info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 1.0em;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 3px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 95vh;
            width: 260px; /* パネルの幅を固定 */
            overflow-y: auto;
            font-size: 14px;
        }
        #controls fieldset {
            border: 1px solid #555;
            border-radius: 4px;
            padding: 5px 8px;
            margin: 3px 0;
        }
        #controls legend {
            padding: 0 5px;
            color: #00aaff;
            font-weight: bold;
        }
        #controls button, .modal button {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        #controls button:hover:not(:disabled), .modal button:hover:not(:disabled) {
            background-color: #555;
            border-color: #888;
        }
        #controls button:disabled, .modal button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        #controls label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        #load-controls h4 {
            margin: 0;
            font-weight: normal;
            font-size: 0.9em;
            color: #ccc;
        }
        #dynamic-toggles {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #dynamic-toggles label span {
            white-space: nowrap; /* テキストを改行させない */
            overflow: hidden; /* はみ出したテキストを隠す */
            text-overflow: ellipsis; /* はみ出した部分を...で表示 */
            min-width: 0; /* flexアイテムが縮むのを許可 */
            vertical-align: middle; /* チェックボックスとテキストの垂直位置を中央に揃える */
        }

        .modal {
            display: none; 
            position: fixed;
            z-index: 200; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .modal-content {
            background-color: #2a2a2a;
            margin: 10% auto; /* 上部の余白を調整 */
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 550px;
            border-radius: 5px;
            color: #fff;
        }
        .modal-content h3 {
            margin-top: 0;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 5px;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        #map-list-container, #unload-list-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #555;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            background-color: #222;
        }
        .modal-content input[type="text"], .modal-content select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background-color: #444; color: #fff; border: 1px solid #666; border-radius: 4px;
        }
        #waypoint-info {
            position: absolute;
            bottom: 10px; /* 画面下部に配置 */
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 10;
            max-width: 300px;
            display: none; /* 初期状態では非表示 */
            flex-direction: column;
            gap: 5px;
            border: 1px solid #555;
        }
        #waypoint-info h4 {
            margin: 0 0 5px 0;
            font-weight: bold;
            color: #ffcc00; /* 強調色 */
        }
        #waypoint-info fieldset {
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px 10px;
            margin: 5px 0;
        }
        #waypoint-info legend {
            padding: 0 5px;
            font-weight: bold;
            color: #bbb;
        }
        #waypoint-info .coord-input {
            display: flex;
            justify-content: space-between; /* ラベルと入力ボックスを両端に配置 */
            align-items: center;
            margin-bottom: 5px;
        }
        #waypoint-info .coord-input label {
            flex-shrink: 0; /* ラベルが縮まないようにする */
            margin-right: 10px; /* ラベルと入力ボックスの間に余白を追加 */
            font-size: 0.95em;
        }
        #waypoint-info .coord-input input {
            width: 70px; /* 入力フィールドの幅 */
            padding: 2px 5px;
            border: 1px solid #777;
            background-color: #444;
            color: #fff;
            border-radius: 3px;
        }
        #waypoint-legend-container {
            position: absolute; /* 絶対位置指定 */
            bottom: 10px; /* 下からの距離 */
            left: 10px; /* 左からの距離 */
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 10;
        }
        #waypoint-legend-container h4 {
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        /* タブレット・スマートフォン向けのレスポンシブ対応 */
        @media screen and (max-width: 768px) {
            #controls {
                width: 240px; /* 少し幅を狭くする */
            }
        }

        @media screen and (max-width: 480px) {
            #controls {
                width: auto; /* 幅を自動調整 */
                left: 10px; /* 左にも配置 */
                max-width: calc(100vw - 20px); /* 画面幅いっぱいに広がらないように */
                max-height: 25vh; /* 高さを制限してマップが見えるように */
            }

            #waypoint-info {
                max-width: 220px;
                max-height: 45vh;
                overflow-y: auto;
            }
        }



        @media screen and (max-width: 1024px) {
            .modal-content {
                width: 90vw; /* タブレットではビューポート幅の90%に */
            }
        }

        let waypoints = []; 
        let mapData = null; 
        const meshRegistry = {}; 
        let currentMapName = '{{ map_name }}';
        let scene, camera, renderer, pcdLoader;

        function quaternionToYaw(qx, qy, qz, qw) {
            const siny_cosp = 2 * (qw * qz + qx * qy);
            const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
            return Math.atan2(siny_cosp, cosy_cosp);
        }
        function getColorByType(type) {
            switch (type) {
                case 'normal':
                    return 0x00ff00; // 緑
                case 'slow':
                    return 0xffff00; // 黄
                case 'stop':
                    return 0xff0000; // 赤
                default:
                    return 0x00ffff; // 水色 (デフォルト)
            }
        }

        async function parsePGM(urlOrBuffer, mapData) {
            let buffer;
            if (typeof urlOrBuffer === 'string') {
                const response = await fetch(urlOrBuffer);
                if (!response.ok) {
                    throw new Error(`Failed to fetch PGM file: ${response.statusText}`);
                }
                buffer = await response.arrayBuffer();
            } else {
                buffer = urlOrBuffer;
            }
            const decoder = new TextDecoder('ascii');
            let offset = 0;
            let magicNumber = decoder.decode(new Uint8Array(buffer, offset, 2));
            if (magicNumber !== 'P5') {
                throw new Error(`Unsupported PGM format: ${magicNumber}. Only P5 (binary) is supported.`);
            }
            offset += 2;
            let headerText = '';
            let headerEndIndex = -1;
            for (let i = offset; i < buffer.byteLength; i++) {
                const charCode = new Uint8Array(buffer, i, 1)[0];
                const char = String.fromCharCode(charCode);
                if (char === '\n') {
                    const lines = headerText.split('\n').map(line => line.trim()).filter(line => line !== '');
                    const dataLines = lines.filter(line => !line.startsWith('#'));
                    if (dataLines.length >= 2) {
                        headerEndIndex = i + 1; // ピクセルデータの開始位置
                        break;
                    }
                }
                headerText += char;
            }
            if (headerEndIndex === -1) {
                throw new Error("PGM header analysis failed.");
            }
            const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
            const dimensions = lines[0].trim().split(/\s+/).map(Number);
            const width = dimensions[0];
            const height = dimensions[1];
            const maxValue = Number(lines[1].trim()); // 通常は255
            if (!width || !height || !maxValue) {
                 throw new Error("PGM header data (width, height, max value) is invalid.");
            }
            const pixelDataStart = headerEndIndex;
            const pixelDataSize = width * height;
            const grayData = new Uint8Array(buffer, pixelDataStart, pixelDataSize);
            const data = new Uint8Array(pixelDataSize * 4);
            const occupiedThresh = mapData.occupied_thresh || 0.65;
            const freeThresh = mapData.free_thresh || 0.196;
            for (let i = 0; i < pixelDataSize; i++) {
                const gray = grayData[i];
                const offset = i * 4;
                if (gray === 0) {
                    data[offset] = 255;     // R
                    data[offset + 1] = 50;  // G
                    data[offset + 2] = 50;  // B
                    data[offset + 3] = 200; // A: 80% 不透明
                } else if (gray === 254) {
                    data[offset] = 150;     // R
                    data[offset + 1] = 255; // G
                    data[offset + 2] = 150; // B
                    data[offset + 3] = 100; // A: 40% 不透明
                } else if (gray === 205) {
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0; // A: 完全に透明
                } else {
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0;
                }
            }
            return { data, width, height, maxValue };
        }
        function createToggle(id, labelText, mesh) {
            const container = document.getElementById('dynamic-toggles');
            const existingLabel = document.getElementById(id + '-label');
            if (existingLabel) {
                existingLabel.remove();
            }
            const label = document.createElement('label');
            label.setAttribute('for', id);
            label.id = id + '-label';
            label.style.display = 'flex';
            label.style.gap = '5px';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = id;
            checkbox.checked = true; // 初期状態は表示
            checkbox.addEventListener('change', () => {
                if (mesh) {
                    mesh.visible = checkbox.checked;
                }
            });
            const span = document.createElement('span');
            span.textContent = labelText;
            label.appendChild(checkbox);
            label.appendChild(span);
            container.appendChild(label);
            return label; 
        }
        async function loadPGMMap(mapName) { 
            const componentType = 'pgm';
            const uniqueId = `${componentType}-${mapName}`;
            unloadMap(componentType, mapName); 
            if (!mapData || !mapData.image) {
                console.warn("YAMLデータが存在しないか、'image'キーがありません。PGMロードをスキップします。");
                return;
            }
            const pgmUrl = '/map/' + mapData.image; // サーバーのURLを構築
            const PGM_Z_OFFSET = 0.0; 
            const origin = mapData.origin; 
            const resolution = mapData.resolution; 
            const pgmImageName = mapData.image; 
            try {
                const pgmResult = await parsePGM(pgmUrl, mapData); 
                const imgWidth = pgmResult.width;
                const imgHeight = pgmResult.height;
                const mapWidth = imgWidth * resolution;
                const mapHeight = imgHeight * resolution;
                const texture = new THREE.DataTexture(
                    pgmResult.data, 
                    imgWidth, 
                    imgHeight, 
                    THREE.RGBAFormat 
                );
                texture.flipY = false; 
                texture.wrapS = THREE.ClampToEdgeWrapping; 
                texture.repeat.set(-1, 1);                  
                texture.offset.set(1, 0);                   
                texture.needsUpdate = true;
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.FrontSide, 
                    transparent: true,
                    opacity: 1.0, 
                });

        async function loadPCD(mapName) {

                points.position.set(0, 0, 0);

        async function loadWaypoints(mapName) {
            const componentType = 'waypoints';
            const uniqueId = `${componentType}-${mapName}`;
            const jsonUrl = `/map/${mapName}.json`; 
            unloadMap(componentType, mapName); 
            try {
                let rawWaypoints;
                const initialWaypointsData = "{{ waypoints_data|safe }}";
                if (initialWaypointsData !== "[]" && currentMapName === mapName) {
                    rawWaypoints = JSON.parse(initialWaypointsData);
                    document.getElementById('info').innerHTML += `<br>Waypoint: ${mapName}.json (初期データ) ロード完了`;
                } else {
                    const response = await fetch(jsonUrl);
                    if (!response.ok) {
                        throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                    }
                    rawWaypoints = await response.json(); 
                }
                if (rawWaypoints.length === 0) {
                    throw new Error("ウェイポイントファイルが空です。");
                }
                waypoints = rawWaypoints;
                const newWaypointsGroup = new THREE.Group();
                draggableObjects = []; // ドラッグ可能オブジェクトをリセット
                newWaypointsGroup.name = uniqueId; 
                const WAYPOINT_Z_OFFSET = 0.0; 
                waypoints.forEach((wp, index) => {
                    if (wp.length < 2) return; 
                    const position = wp[0]; // [x, y, z]
                    const orientation = wp[1]; // [qx, qy, qz, qw]
                    const x = position[0];
                    const y = position[1];
                    const z = WAYPOINT_Z_OFFSET; 
                    const yaw = quaternionToYaw(orientation[0], orientation[1], orientation[2], orientation[3]);
                    const SPHERE_RADIUS = 0.3; 
                    const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 16, 16); 
                    const attributes = wp.length > 2 ? (Array.isArray(wp[2]) ? wp[2][0] : wp[2]) : {};
                    const type = attributes.type || 'default';
                    const colorValue = getColorByType(type);
                    const material = new THREE.MeshBasicMaterial({ color: colorValue }); 
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set(x, y, z);
                    sphere.name = `waypoint_sphere_${index}`;
                    sphere.userData.waypointIndex = index;
                    sphere.userData.attributes = wp.length > 2 ? wp.slice(2) : {}; 
                    draggableObjects.push(sphere);
                    newWaypointsGroup.add(sphere);
                    const dir = new THREE.Vector3(1, 0, 0); 
                    dir.applyAxisAngle(new THREE.Vector3(0, 0, 1), yaw); 
                    const origin = new THREE.Vector3(x, y, z);
                    const length = 1.0; 
                    const color = 0xffff00; 
                    const arrowHelper = new THREE.ArrowHelper(dir, origin, length, color, 0.2, 0.15);
                    arrowHelper.name = `waypoint_arrow_${index}`;
                    newWaypointsGroup.add(arrowHelper);
                });
                newWaypointsGroup.visible = true; 
                scene.add(newWaypointsGroup);
                meshRegistry[uniqueId] = newWaypointsGroup;
                createToggle(uniqueId, `Waypoints (${mapName})`, newWaypointsGroup);
                if (dragControls) {
                    dragControls.getObjects().length = 0;
                    dragControls.getObjects().push(...draggableObjects);
                }
                document.getElementById('info').innerHTML += `<br>Waypointを ${waypoints.length} 個配置完了`;
                if (document.getElementById('auto-orient-waypoints').checked) recalculateAllWaypointOrientations();
                updateWaypointPath(mapName);
            } catch (error) {
                console.error('Waypointファイルのロード中にエラーが発生しました:', error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">Waypointロード失敗: ${error.message}</span>`;
            }
        }
        function updateWaypointPath(mapName) {
            const componentType = 'waypoint-path';
            const uniqueId = `${componentType}-${mapName}`;

            // 既存の経路を削除
            if (meshRegistry[uniqueId]) {
                const oldPath = meshRegistry[uniqueId];
                scene.remove(oldPath);
                oldPath.geometry.dispose();
                oldPath.material.dispose();
                delete meshRegistry[uniqueId];
            }

            if (waypoints.length < 2) {
                const toggleLabel = document.getElementById(uniqueId + '-label');
                if (toggleLabel) toggleLabel.remove();
                return;
            }

            const points = waypoints.map(wp => new THREE.Vector3(wp[0][0], wp[0][1], wp[0][2]));

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 }); // オレンジ色
            const line = new THREE.Line(geometry, material);
            line.name = uniqueId;

            scene.add(line);
            meshRegistry[uniqueId] = line;
        }

        function updateGridBasedOnMapSize() {
            const box = new THREE.Box3();
            let mapFound = false;

            // PCDとPGMのメッシュからバウンディングボックスを計算
            for (const key in meshRegistry) {
                if (key.startsWith('pcd-') || key.startsWith('pgm-')) {
                    const mesh = meshRegistry[key];
                    if (mesh.visible) {
                        box.expandByObject(mesh);
                        mapFound = true;
                    }
                }
            }

            if (!mapFound) return; // マップがなければ何もしない

            const size = box.getSize(new THREE.Vector3());
            const maxSize = Math.max(size.x, size.y, size.z);
            const newGridSize = Math.ceil(maxSize / 100) * 100 * 2; // マップを覆うのに十分なサイズ

            // 既存のグリッドを削除
            while(gridGroup.children.length > 0){
                const grid = gridGroup.children[0];
                grid.geometry.dispose();
                grid.material.dispose();
                gridGroup.remove(grid);
            }

            // 新しいサイズのグリッドを作成
            const grids = [];
            // 1mから10mまでは1m刻み
            for (let i = 1; i <= 10; i++) {
                grids.push({
                    size: newGridSize, divisions: newGridSize / i, scale: `${i}m`,
                    minDistance: (i - 1) * 10, maxDistance: i * 10,
                    color1: 0x888888, color2: 0x444444
                });
            }
            // 10mから100mまでは10m刻み
            for (let i = 2; i <= 10; i++) {
                const unit = i * 10;
                grids.push({
                    size: newGridSize, divisions: newGridSize / unit, scale: `${unit}m`,
                    minDistance: (i - 1) * 50, maxDistance: i * 50,
                    color1: 0xaaaaaa, color2: 0x666666
                });
            }
            // 100m以上
            grids.push({ size: newGridSize, divisions: newGridSize / 100, scale: '100m', minDistance: 500, maxDistance: Infinity, color1: 0xcccccc, color2: 0x888888 });
            grids.forEach(gridDef => createAdaptiveGrid(gridDef));
            updateAdaptiveGrid(); // 初期表示を更新
        }
        window.unloadMap = function(type, mapName) {
            const uniqueId = `${type}-${mapName}`;
            const mesh = meshRegistry[uniqueId];
            let elementExists = false;
            if (type === 'waypoints') {
                if (selectedWaypoint && mesh && selectedWaypoint.parent === mesh) {
                    selectedWaypoint = null;
                    transformControls.detach();
                    hideWaypointInfo();
                }
                // ウェイポイントが削除されたら、関連する経路も削除
                if (meshRegistry[`waypoint-path-${mapName}`]) {
                    unloadMap('waypoint-path', mapName);
                }
            }
            if (mesh) {
                if (mesh.isMesh || mesh.isPoints) {
                    mesh.geometry.dispose();
                    if (mesh.material.map) mesh.material.map.dispose();
                    mesh.material.dispose();
                } else if (mesh.isGroup) {
                    for (let i = mesh.children.length - 1; i >= 0; i--) {
                        const child = mesh.children[i];
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                if (child.material.dispose) child.material.dispose();
                            }
                        }
                        mesh.remove(child);
                    }
                }
                scene.remove(mesh);
                delete meshRegistry[uniqueId];
                elementExists = true;
                const toggleLabel = document.getElementById(uniqueId + '-label');
                if (toggleLabel) {
                    toggleLabel.remove();
                }
                if (type === 'pgm') {
                    mapData = null; 
                    document.getElementById('pgm-opacity-label').style.display = 'none'; // スライダーを非表示
                }
                // ウェイポイントがアンロードされたら、経路もアンロード
                if (type === 'waypoints') {
                    const pathId = `waypoint-path-${mapName}`;
                    if (meshRegistry[pathId]) unloadMap('waypoint-path', mapName);
                }
            }
            if (elementExists) {
                return true;
            }
            return false;
        }
        function recalculateAllWaypointOrientations() {
            if (waypoints.length < 2) return;

            const waypointsGroup = scene.getObjectByName(`${'waypoints'}-${currentMapName}`);
            if (!waypointsGroup) return;

            for (let i = 0; i < waypoints.length - 1; i++) {
                const currentPos = new THREE.Vector3().fromArray(waypoints[i][0]);
                const nextPos = new THREE.Vector3().fromArray(waypoints[i + 1][0]);

                const direction = new THREE.Vector3().subVectors(nextPos, currentPos);
                const yawRad = Math.atan2(direction.y, direction.x);

                // Update waypoints array
                const newQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, yawRad));
                waypoints[i][1] = [newQuat.x, newQuat.y, newQuat.z, newQuat.w];

                // Update ArrowHelper in the scene
                const arrow = waypointsGroup.children.find(c => c.name === `waypoint_arrow_${i}`);
                if (arrow) {
                    arrow.setDirection(direction.normalize());
                }

                // Update TransformControls if this waypoint is selected
                if (selectedWaypoint && selectedWaypoint.userData.waypointIndex === i) {
                    selectedWaypoint.quaternion.copy(newQuat);
                    displayWaypointInfo(i, selectedWaypoint.position, selectedWaypoint.userData.attributes);
                }
            }
            document.getElementById('info').innerHTML = '全ウェイポイントの向きを自動調整しました。';
        }
        function toggleAutoOrient(isAuto) {
            const yawInput = document.getElementById('edit-yaw');

            if (isAuto) {

            }
        }

        function onWaypointClick(event) {
            // ウェイポイント追加モード中は選択処理を無効化
            if (isAddingWaypointMode) {
                const container = document.getElementById('viewer-container');
                mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
                mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                // 1. PGMマップがあればそれを優先的に判定対象にする
                const pgmObjects = Object.keys(meshRegistry)
                                         .filter(key => key.startsWith('pgm-'))
                                         .map(key => meshRegistry[key]);

                let intersects;
                if (pgmObjects.length > 0 && pgmObjects[0].visible) {
                    // PGMマップが表示されている場合
                    intersects = raycaster.intersectObjects(pgmObjects);
                } else {
                    // PGMマップがない、または非表示の場合はグリッドを判定対象にする
                    intersects = raycaster.intersectObject(groundPlane);
                }

                if (intersects.length > 0) {
                    const intersectPoint = intersects[0].point;
                    // Z座標を強制的に0に設定して追加
                    addWaypointAt(new THREE.Vector3(intersectPoint.x, intersectPoint.y, 0), currentInsertionIndex);
                    document.getElementById('info').innerHTML = `ウェイポイントを (${intersectPoint.x.toFixed(2)}, ${intersectPoint.y.toFixed(2)}) に追加しました。`;
                    toggleAddWaypointMode(); // 1つ追加したらモードを解除
                }
                return;
            }

            event.preventDefault();

            const container = document.getElementById('viewer-container');
            mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // ウェイポイント追加モードのキーボード解除
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isAddingWaypointMode) {
                    toggleAddWaypointMode(null);
                }
            });
            let waypointsGroup = null;
            for (const key in meshRegistry) {
                if (key.startsWith('waypoints-')) {
                    waypointsGroup = meshRegistry[key];
                    break;
                }
            }
            if (!waypointsGroup) return;
            const intersects = raycaster.intersectObjects(waypointsGroup.children.filter(c => c.isMesh && c.name.startsWith('waypoint_sphere_'))); 
            if (selectedWaypoint) {
                selectedWaypoint.material.color.setHex(0x00ffff);
                // 選択解除時に元の色に戻す
                const index = selectedWaypoint.userData.waypointIndex;
                const wp = waypoints[index];
                const attrs = wp && wp.length > 2 ? (Array.isArray(wp[2]) ? wp[2][0] : wp[2]) : {};
                const type = attrs.type || 'default';
                const originalColor = getColorByType(type);
                selectedWaypoint.material.color.setHex(originalColor);
                // 選択されていたオブジェクトがシーンから削除されている可能性があるため、
                // transformControlsがそれを参照している場合はデタッチする
                if (transformControls.object === selectedWaypoint) {
                    transformControls.detach();
                }
                document.getElementById('add-waypoint-after-button').disabled = true;
                selectedWaypoint = null;
            }
            if (intersects.length > 0) {
                const intersectedObject = intersects[0].object;
                if (intersectedObject.isMesh && intersectedObject.name.startsWith('waypoint_sphere_')) {
                    selectedWaypoint = intersectedObject;
                    dragControls.enabled = true; // 選択されたらドラッグを有効化
                    transformControls.attach(selectedWaypoint);

                    const index = selectedWaypoint.userData.waypointIndex;
                    const position = selectedWaypoint.position;
                    const attributes = selectedWaypoint.userData.attributes;

                    displayWaypointInfo(index, position, attributes);
                    document.getElementById('add-waypoint-after-button').disabled = false;
                } else {
                    hideWaypointInfo();
                }
            } else {
                hideWaypointInfo();
            }
        }

        function displayWaypointInfo(index, position, attributes) {
            const infoDiv = document.getElementById('wp-details');
            const infoPanel = document.getElementById('waypoint-info');
            const editX = document.getElementById('edit-x');
            const editY = document.getElementById('edit-y');
            const editYaw = document.getElementById('edit-yaw');
            const attributesDiv = document.getElementById('wp-attributes-details');
            const deleteButton = document.getElementById('delete-waypoint-button'); // 修正：このボタンはwaypoint-infoパネル内にあります

            const waypointsGroup = selectedWaypoint.parent;
            const arrow = waypointsGroup.children.find(c => c.name === `waypoint_arrow_${index}`);
            const yawRad = arrow ? arrow.rotation.z : 0;
            const yawDeg = THREE.MathUtils.radToDeg(yawRad);

            let basicInfoHtml = `
                <p><strong>インデックス:</strong> ${index}</p>
                <p><strong>位置:</strong> X: ${position.x.toFixed(3)}, Y: ${position.y.toFixed(3)}</p>
                <p><strong>向き (Yaw):</strong> ${yawDeg.toFixed(1)}°</p>
            `;

            let distanceInfoHtml = '<p><strong>距離:</strong> ';
            if (index > 0) {
                const prevPos = new THREE.Vector3().fromArray(waypoints[index - 1][0]);
                const currentPosVec = new THREE.Vector3().copy(position);
                const distToPrev = currentPosVec.distanceTo(prevPos);
                distanceInfoHtml += `前まで: ${distToPrev.toFixed(2)}m`;
            }
            if (index < waypoints.length - 1) {
                const nextPos = new THREE.Vector3().fromArray(waypoints[index + 1][0]);
                const currentPosVec = new THREE.Vector3().copy(position);
                const distToNext = currentPosVec.distanceTo(nextPos);
                if (index > 0) distanceInfoHtml += ', ';
                distanceInfoHtml += `次まで: ${distToNext.toFixed(2)}m`;
            }
            basicInfoHtml += distanceInfoHtml + '</p>';

            // 属性を編集可能なテキストボックスとして表示
            let attributesHtml = '';
            const processAttribute = (attr, subIndex = null) => {
                if (typeof attr === 'object' && attr !== null) {
                    for (const key in attr) {
                        const inputId = `edit-attr-${index}-${key}` + (subIndex !== null ? `-${subIndex}` : '');
                        attributesHtml += `<div class="coord-input">`;
                        attributesHtml += `<label for="${inputId}" style="width: auto; min-width: 60px;">${key}:</label>`;

                        if (key === 'type') {
                            attributesHtml += `
                                <select id="${inputId}" data-index="${index}" data-key="${key}" ${subIndex !== null ? `data-sub-index="${subIndex}"` : ''} style="width: 100px; padding: 2px 5px; border: 1px solid #777; background-color: #444; color: #fff; border-radius: 3px;">
                                    <option value="normal" ${attr[key] === 'normal' ? 'selected' : ''}>normal</option>
                                    <option value="slow" ${attr[key] === 'slow' ? 'selected' : ''}>slow</option>
                                    <option value="stop" ${attr[key] === 'stop' ? 'selected' : ''}>stop</option>
                                </select>
                            `;
                        } else {
                            attributesHtml += `
                                <input type="text" id="${inputId}" value="${attr[key]}" placeholder="${key}"
                                       data-index="${index}" data-key="${key}" ${subIndex !== null ? `data-sub-index="${subIndex}"` : ''}>
                            `;
                        }
                        attributesHtml += `</div>`;
                    }
                }
            };
            if (Array.isArray(attributes)) { // 属性が配列の場合
                attributes.forEach((attr, i) => processAttribute(attr, i));
            } else if (typeof attributes === 'object' && attributes !== null) { // 属性が単一オブジェクトの場合
                processAttribute(attributes);
            }

            infoDiv.innerHTML = basicInfoHtml;
            attributesDiv.innerHTML = attributesHtml;

            editX.value = position.x.toFixed(3);
            editY.value = position.y.toFixed(3);
            editX.disabled = false; // 編集可能にする
            editY.disabled = false; // 編集可能にする
            editYaw.disabled = false; // 編集可能にする
            editYaw.value = yawDeg.toFixed(1);
            deleteButton.disabled = false;

            infoPanel.style.display = 'flex';

            // 生成されたinput要素にイベントリスナーを追加
            attributesDiv.querySelectorAll('input[type="text"], select').forEach(input => {
                input.addEventListener('change', handleAttributeChange);
            });
        }

        function handleAttributeChange(event) {
            if (!selectedWaypoint) return;

            const input = event.target;
            const index = parseInt(input.dataset.index, 10);
            const key = input.dataset.key;
            const subIndex = input.dataset.subIndex ? parseInt(input.dataset.subIndex, 10) : null;
            let value = input.value;

            const originalValue = subIndex !== null ? waypoints[index][2 + subIndex]?.[key] : waypoints[index][2]?.[key];

            // 元のデータ型が数値なら、入力値も数値に変換する
            if (typeof originalValue === 'number' && !isNaN(parseFloat(value))) {
                value = parseFloat(value);
            }

            if (subIndex !== null) {
                if (!waypoints[index][2 + subIndex]) waypoints[index][2 + subIndex] = {};
                 waypoints[index][2 + subIndex][key] = value;
            } else {
                // 属性が配列でない場合
                if (!Array.isArray(waypoints[index][2])) {
                    if (typeof waypoints[index][2] !== 'object' || waypoints[index][2] === null) waypoints[index][2] = {};
                    waypoints[index][2][key] = value;
                }
                
            }

            // typeが変更されたら、球体の色も更新する
            if (key === 'type') {
                const newColor = getColorByType(value);
                selectedWaypoint.material.color.setHex(newColor);
            }
            document.getElementById('info').innerHTML = `ウェイポイント ${index} の属性 '${key}' を更新しました。`;
        }
        function hideWaypointInfo() {
            document.getElementById('waypoint-info').style.display = 'none';
            document.getElementById('delete-waypoint-button').disabled = true;
            document.getElementById('add-waypoint-after-button').disabled = true;
        }

        function applyPositionChange() {
            if (!selectedWaypoint) return;

            const index = selectedWaypoint.userData.waypointIndex;
            const newX = parseFloat(document.getElementById('edit-x').value);
            const newY = parseFloat(document.getElementById('edit-y').value);

            if (isNaN(newX) || isNaN(newY)) {
                alert("無効な座標です。数値で入力してください。");
                // 元の値に戻す
                document.getElementById('edit-x').value = selectedWaypoint.position.x.toFixed(3);
                document.getElementById('edit-y').value = selectedWaypoint.position.y.toFixed(3);
                return;
            }

            // 3Dオブジェクトの位置を更新
            selectedWaypoint.position.set(newX, newY, 0.0);

            // 矢印の位置も更新
            const waypointsGroup = selectedWaypoint.parent;
            const arrow = waypointsGroup.children.find(c => c.name === `waypoint_arrow_${index}`);
            if (arrow) {
                arrow.position.copy(selectedWaypoint.position);
            }

            // データ配列を更新
            waypoints[index][0] = [newX, newY, 0.0];

            // 経路と向きを再計算
            updateWaypointPath(currentMapName);
            if (document.getElementById('auto-orient-waypoints').checked) recalculateAllWaypointOrientations();
        }

        function applyYawChange() {
            if (!selectedWaypoint) {
                alert("ウェイポイントが選択されていません。");
                return;
            }
            const index = selectedWaypoint.userData.waypointIndex;
            const newYawDeg = parseFloat(document.getElementById('edit-yaw').value);
            if (isNaN(newYawDeg)) {
                alert("無効なYaw角です。数値で入力してください。");
                return;
            }
            const newYawRad = THREE.MathUtils.degToRad(newYawDeg);

            const waypointsGroup = selectedWaypoint.parent;
            if (waypointsGroup) {
                const arrow = waypointsGroup.children.find(c => c.name === `waypoint_arrow_${index}`);
                if (arrow) {
                    arrow.rotation.z = newYawRad;
                }
            }

            const newQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, newYawRad));

            if (waypoints[index]) {
                waypoints[index][1] = [newQuat.x, newQuat.y, newQuat.z, newQuat.w];
            }
            displayWaypointInfo(index, selectedWaypoint.position, selectedWaypoint.userData.attributes);
            document.getElementById('info').innerHTML = `ウェイポイント ${index} の向きを ${newYawDeg.toFixed(1)}° に更新しました。`;
        }

        function deleteSelectedWaypoint() {
            if (!selectedWaypoint) {
                alert("削除するウェイポイントが選択されていません。");
                return;
            }

            const indexToDelete = selectedWaypoint.userData.waypointIndex;
            if (confirm(`ウェイポイント ${indexToDelete} を削除しますか？`)) {
                const waypointsGroup = selectedWaypoint.parent;
                // 1. TransformControlsからデタッチ
                transformControls.detach();
                // 2. シーンから球体と矢印を削除
                const arrowToDelete = waypointsGroup.children.find(c => c.name === `waypoint_arrow_${indexToDelete}`);
                waypointsGroup.remove(selectedWaypoint);
                if (arrowToDelete) {
                    waypointsGroup.remove(arrowToDelete);
                }
                // 3. waypoints配列とdraggableObjectsからデータを削除
                waypoints.splice(indexToDelete, 1);
                const draggableIndex = draggableObjects.indexOf(selectedWaypoint);
                if (draggableIndex > -1) {
                    draggableObjects.splice(draggableIndex, 1);
                }
                // 4. ウェイポイントグループの子供をすべてクリアし、waypoints配列に基づいて再構築
                while(waypointsGroup.children.length > 0){
                    const child = waypointsGroup.children[0];
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else if (child.material.dispose) child.material.dispose();
                    }
                    waypointsGroup.remove(child);
                };
                draggableObjects.length = 0; // draggableObjectsもクリア
                dragControls.getObjects().length = 0; // DragControlsのオブジェクトもクリア
                // waypoints配列に基づいて、すべてのウェイポイントオブジェクトを再作成
                waypoints.forEach((wp, idx) => {
                    const pos = wp[0];
                    const quat = wp[1];
                    const attrs = wp.length > 2 ? wp.slice(2) : {};

                    const SPHERE_RADIUS = 0.3;
                    const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 16, 16);
                    const type = (attrs && attrs.length > 0 && attrs[0].type) ? attrs[0].type : 'default';
                    const color = getColorByType(type);
                    const material = new THREE.MeshBasicMaterial({ color: color });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set(pos[0], pos[1], pos[2]);
                    sphere.name = `waypoint_sphere_${idx}`;
                    sphere.userData.waypointIndex = idx;
                    sphere.userData.attributes = attrs;
                    waypointsGroup.add(sphere);
                    draggableObjects.push(sphere);

                    const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion().fromArray(quat));
                    const arrowHelper = new THREE.ArrowHelper(dir, sphere.position, 1.0, 0xffff00, 0.2, 0.15);
                    arrowHelper.name = `waypoint_arrow_${idx}`;
                    arrowHelper.userData = { waypointIndex: idx };
                    waypointsGroup.add(arrowHelper);
                });
                dragControls.getObjects().push(...draggableObjects);

                // 選択状態をクリア
                selectedWaypoint = null;
                hideWaypointInfo();
                document.getElementById('info').innerHTML = `ウェイポイント ${indexToDelete} を削除しました。`;
                updateWaypointPath(currentMapName);
                if (document.getElementById('auto-orient-waypoints').checked) recalculateAllWaypointOrientations();
            }
        }

        function addWaypointAt(position, insertionIndex) {
            if (!currentMapName) {
                alert("ウェイポイントを追加するには、まずマップをロードまたは指定してください。");
                toggleAddWaypointMode(null); // モードを解除
                return;
            }
        
            const componentType = 'waypoints';
            const uniqueId = `${componentType}-${currentMapName}`;
            let waypointsGroup = scene.getObjectByName(uniqueId);
        
            // ウェイポイントグループがなければ新規作成
            if (!waypointsGroup) {
                waypointsGroup = new THREE.Group();
                waypointsGroup.name = uniqueId;
                scene.add(waypointsGroup);
                meshRegistry[uniqueId] = waypointsGroup;
                createToggle(uniqueId, `Waypoints (${currentMapName})`, waypointsGroup); 
            }
        
            const WAYPOINT_Z_OFFSET = 0.0;
            const x = position.x;
            const y = position.y;
            const z = WAYPOINT_Z_OFFSET;
        
            const defaultAttributes = {
                "type": "normal",
                "value": 0.0,
                "xy_tolerance": 1.0,
                "yaw_tolerance": 3.14
            };

            const newWpData = [[x, y, z], [0, 0, 0, 1], defaultAttributes]; // [position], [quaternion], [attributes]
            const finalIndex = (insertionIndex === undefined || insertionIndex > waypoints.length) ? waypoints.length : insertionIndex;
            waypoints.splice(finalIndex, 0, newWpData);

            // 既存のウェイポイントオブジェクトをすべてクリア
            while(waypointsGroup.children.length > 0){ 
                waypointsGroup.remove(waypointsGroup.children[0]); 
            }
            draggableObjects = [];
            dragControls.getObjects().length = 0;

            // 選択状態をクリア
            selectedWaypoint = null;
            transformControls.detach();

            // waypoints配列からすべてのオブジェクトを再生成
            waypoints.forEach((wp, idx) => {
                const pos = wp[0];
                const quat = wp[1];
                const attrs = wp.length > 2 ? wp.slice(2) : {};

                const SPHERE_RADIUS = 0.3;
                const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 16, 16);
                const type = (attrs && attrs.length > 0 && attrs[0].type) ? attrs[0].type : 'default';
                const color = getColorByType(type);
                const material = new THREE.MeshBasicMaterial({ color: color });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(pos[0], pos[1], pos[2]);
                sphere.name = `waypoint_sphere_${idx}`;
                sphere.userData.waypointIndex = idx;
                sphere.userData.attributes = attrs;
                waypointsGroup.add(sphere);
                draggableObjects.push(sphere);

                const dir = new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion().fromArray(quat));
                const arrowHelper = new THREE.ArrowHelper(dir, sphere.position, 1.0, 0xffff00, 0.2, 0.15);
                arrowHelper.name = `waypoint_arrow_${idx}`;
                arrowHelper.userData = { waypointIndex: idx };
                waypointsGroup.add(arrowHelper);
            });
            dragControls.getObjects().push(...draggableObjects);

            updateWaypointPath(currentMapName);
            if (document.getElementById('auto-orient-waypoints').checked) recalculateAllWaypointOrientations();
        }

        let currentInsertionIndex = undefined;
        function toggleAddWaypointMode(insertionMode) {
            isAddingWaypointMode = !isAddingWaypointMode;
            const container = document.getElementById('viewer-container');
            const buttons = [
                document.getElementById('add-waypoint-end-button'),
                document.getElementById('add-waypoint-start-button'),
                document.getElementById('add-waypoint-after-button')
            ];
            const infoDiv = document.getElementById('info');

            if (isAddingWaypointMode) {
                container.classList.add('add-waypoint-mode');
                currentInsertionIndex = insertionMode;
                let modeText = insertionMode === 0 ? "先頭" : (insertionMode === undefined ? "末尾" : "選択後");
                infoDiv.innerHTML += `<br><span id="add-wp-msg" style="color: #ffcc00;">マップ上をクリックしてウェイポイントを${modeText}に追加... (Escでキャンセル)</span>`;
                buttons.forEach(b => b.textContent = `追加中 (${modeText})... (Escで解除)`);
                buttons.forEach(b => b.style.backgroundColor = '#ff8c00');
            } else {
                container.classList.remove('add-waypoint-mode');
                const msg = document.getElementById('add-wp-msg');
                if (msg) msg.remove();
                buttons[0].textContent = '末尾に追加';
                buttons[1].textContent = '先頭に追加';
                buttons[2].textContent = '選択中の後に追加';
                buttons.forEach(b => b.style.backgroundColor = '');
                currentInsertionIndex = undefined;
            }
        }
        function createAdaptiveGrid({ size, divisions, scale, minDistance, maxDistance, color1, color2 }) {
            const grid = new THREE.GridHelper(size, divisions, color1, color2);
            grid.rotation.x = Math.PI / 2;
            grid.userData = { scale, minDistance, maxDistance };
            grid.visible = false; // 初期状態では非表示
            gridGroup.add(grid);
        }
        function updateAdaptiveGrid() {
            if (!gridGroup.visible) {
                gridInfoDiv.style.display = 'none';
                return;
            }
            gridInfoDiv.style.display = 'block';
            const distance = camera.position.distanceTo(orbitControls.target);
            let newActiveGrid = null;
            // 距離に最も近いグリッドを見つける
            for (const grid of gridGroup.children) {
                const { minDistance, maxDistance } = grid.userData;
                if (distance >= minDistance && distance < maxDistance) {
                    newActiveGrid = grid;
                    break;
                }
            }
            // 見つかったグリッドのみ表示
            gridGroup.children.forEach(grid => {
                grid.visible = (grid === newActiveGrid);
            });
            gridInfoDiv.textContent = newActiveGrid ? `Grid: ${newActiveGrid.userData.scale}` : 'Grid: Off';
        }
        function init() {
            const container = document.getElementById('viewer-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333); 
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5); 
            camera.up.set(0, 0, 1);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            orbitControls = new OrbitControls(camera, renderer.domElement);
            orbitControls.minDistance = 0.5;
            orbitControls.maxDistance = 500;
            orbitControls.target.set(0, 0, 0); 
            orbitControls.update();

            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.setMode('rotate');
            transformControls.showX = false;
            transformControls.showY = false;
            transformControls.showZ = true;
            transformControls.addEventListener('mouseDown', function () {
                orbitControls.enabled = false;
            });
            transformControls.addEventListener('dragging-changed', function (event) {
                orbitControls.enabled = !event.value;
            });
            transformControls.addEventListener('mouseUp', () => { if (selectedWaypoint) dragControls.enabled = true; }); // この行は変更なし
            transformControls.addEventListener('objectChange', (event) => {
                if (selectedWaypoint) {
                    const index = selectedWaypoint.userData.waypointIndex;
                    // TransformControlsはオブジェクトのquaternionを直接変更するため、
                    // selectedWaypoint.quaternion から最新の回転情報を取得します。
                    const newQuat = selectedWaypoint.quaternion;
                    
                    if (waypoints[index]) {
                        // waypoints配列内のクォータニオンデータを更新
                        waypoints[index][1] = [newQuat.x, newQuat.y, newQuat.z, newQuat.w];
                    }

                    // 矢印ヘルパーの向きも同期させます
                    const waypointsGroup = selectedWaypoint.parent;
                    const arrow = waypointsGroup.children.find(c => c.name === `waypoint_arrow_${index}`);
                    if (arrow) {
                        // 矢印の向きを球体の向きに合わせる
                        arrow.setDirection(new THREE.Vector3(1, 0, 0).applyQuaternion(newQuat));
                    }
                    // ドラッグ中のみウェイポイント情報をリアルタイムで更新
                    if (transformControls.dragging) {
                        displayWaypointInfo(index, selectedWaypoint.position, selectedWaypoint.userData.attributes);
                    }
                }
            });
            transformControls.addEventListener('dragging-changed', function (event) {
                orbitControls.enabled = !event.value;
                if (!event.value) { // ドラッグが終了した時
                    if (selectedWaypoint) {
                        displayWaypointInfo(selectedWaypoint.userData.waypointIndex, selectedWaypoint.position, selectedWaypoint.userData.attributes);
                    }
                }
            });
            scene.add(transformControls);

            dragControls = new DragControls(draggableObjects, camera, renderer.domElement);
            dragControls.addEventListener('dragstart', function (event) {
                orbitControls.enabled = false;
                transformControls.enabled = false;
            });
            dragControls.addEventListener('drag', function (event) {
                const index = event.object.userData.waypointIndex;
                // Z軸を固定
                event.object.position.z = 0.0;

                const arrow = event.object.parent.children.find(c => c.name === `waypoint_arrow_${index}`);
                if (arrow) {
                    arrow.position.copy(event.object.position);
                }
                selectedWaypoint = event.object; // ドラッグ中のオブジェクトを選択中として設定
                displayWaypointInfo(index, event.object.position, event.object.userData.attributes);
            });
            dragControls.addEventListener('dragend', function (event) {
                orbitControls.enabled = true;
                transformControls.enabled = true;
                // waypoints 配列の座標を更新
                const index = event.object.userData.waypointIndex;
                if (waypoints[index]) {
                    waypoints[index][0][0] = event.object.position.x;
                    waypoints[index][0][1] = event.object.position.y;
                    waypoints[index][0][2] = event.object.position.z;
                }
                if (document.getElementById('auto-orient-waypoints').checked) recalculateAllWaypointOrientations();
                updateWaypointPath(currentMapName);
            });
            dragControls.enabled = false; // 初期状態ではドラッグを無効化


            pcdLoader = new PCDLoader();
            raycaster = new THREE.Raycaster(); 
            raycaster.params.Points.threshold = 0.1; 
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('load-map-button').addEventListener('click', startLoadProcess);
            document.getElementById('unload-map-button').addEventListener('click', startUnloadProcess);
            renderer.domElement.addEventListener('click', onWaypointClick, false);
            document.getElementById('edit-yaw').addEventListener('change', applyYawChange);
            document.getElementById('save-waypoints-button').addEventListener('click', saveWaypointsToServer);
            document.getElementById('edit-x').addEventListener('change', applyPositionChange);
            document.getElementById('edit-y').addEventListener('change', applyPositionChange);
            document.getElementById('delete-waypoint-button').addEventListener('click', deleteSelectedWaypoint);
            document.getElementById('add-waypoint-end-button').addEventListener('click', () => toggleAddWaypointMode(undefined));
            document.getElementById('add-waypoint-start-button').addEventListener('click', () => toggleAddWaypointMode(0));
            document.getElementById('add-waypoint-after-button').addEventListener('click', () => {
                if (selectedWaypoint) {
                    toggleAddWaypointMode(selectedWaypoint.userData.waypointIndex + 1);
                } else {
                    alert("基準となるウェイポイントを選択してください。");
                }
            });
            document.getElementById('auto-orient-waypoints').addEventListener('change', (event) => {
                toggleAutoOrient(event.target.checked);
            });

            // アダプティブグリッドの初期化
            const initialSize = 200;
            const grids = [];
            for (let i = 1; i <= 10; i++) {
                grids.push({ size: initialSize, divisions: initialSize / i, scale: `${i}m`, minDistance: (i - 1) * 10, maxDistance: i * 10, color1: 0x888888, color2: 0x444444 });
            }
            for (let i = 2; i <= 10; i++) {
                const unit = i * 10;
                grids.push({ size: initialSize, divisions: initialSize / unit, scale: `${unit}m`, minDistance: (i - 1) * 50, maxDistance: i * 50, color1: 0xaaaaaa, color2: 0x666666 });
            }
            grids.push({ size: initialSize, divisions: initialSize / 100, scale: '100m', minDistance: 500, maxDistance: Infinity, color1: 0xcccccc, color2: 0x888888 });

            grids.forEach(gridDef => createAdaptiveGrid(gridDef));
            scene.add(gridGroup);

            // 地面判定用の透明な平面を作成
            const planeGeometry = new THREE.PlaneGeometry(2000, 2000); // 十分大きな平面
            const planeMaterial = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
            groundPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            groundPlane.position.set(0, 0, 0); // Z=0平面に配置
            scene.add(groundPlane);

            // グリッド表示切替
            document.getElementById('grid-toggle').addEventListener('change', (event) => {
                gridGroup.visible = event.target.checked;
                updateAdaptiveGrid();
            });

            // PGM透過度スライダー
            document.getElementById('pgm-opacity-slider').addEventListener('input', (event) => {
                const opacity = parseFloat(event.target.value);
                for (const key in meshRegistry) {
                    if (key.startsWith('pgm-')) {
                        const pgmMesh = meshRegistry[key];
                        if (pgmMesh && pgmMesh.material) {
                            pgmMesh.material.opacity = opacity;
                        }
                    }
                }
            });
            
            const initialMapName = "{{ map_name }}"; 
            if (initialMapName) {
                currentMapName = initialMapName;
                document.getElementById('map-name-input').value = initialMapName;
                const hasInitialPCD = true; 
                const hasInitialYAML = "{{ yaml_data|safe }}" !== "";
                const hasInitialWaypoints = "{{ waypoints_data|safe }}" !== "[]";
                if (hasInitialPCD || hasInitialYAML || hasInitialWaypoints) {
                    executeMapLoading(initialMapName, hasInitialPCD, hasInitialYAML, hasInitialWaypoints);
                    if (hasInitialWaypoints) updateWaypointPath(initialMapName);
                } else {
                    document.getElementById('loading-message').textContent = `マップ: '${initialMapName}' のデータが見つかりません。ロードボタンから再試行してください。`;
                }
            } else {
                document.getElementById('loading-message').textContent = "マップを選択してください。";
                startLoadProcess();
            }
            animate();
        }
        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            updateAdaptiveGrid();
            renderer.render(scene, camera);
        }

        async function saveWaypointsToServer() {
            if (!currentMapName) {
                alert("マップがロードされていません。");
                return;
            }
            if (waypoints.length === 0) {
                alert("保存するウェイポイントがありません。");
                return;
            }

            try {
                const response = await fetch('/save_waypoints', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        map_name: currentMapName,
                        waypoints: waypoints,
                    }),
                });
                const result = await response.json();
                alert(result.message); // サーバーからのメッセージを表示
            } catch (error) {
                console.error('ウェイポイントの保存中にエラーが発生しました:', error);
                alert('ウェイポイントの保存に失敗しました。');
            }
        }
        init();
    </script>
</body>
</html>
