<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_new %}新規CSV作成{% else %}テキスト編集: {{ filename }}{% endif %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/editor.css') }}">
</head>
<body class="page">
    <div class="container container--wide">
        <h1>{% if is_new %}新規CSV作成 (テキストモード){% else %}テキスト編集: {{ filename }}{% endif %}</h1>
        <form action="{{ url_for('save_plain_text') }}" method="post">
            {% if is_new %}
                <input type="text" name="filename" class="filename-input" placeholder="ファイル名を入力 (.csv)" required>
                <input type="hidden" name="dir_type" value="config">
            {% else %}
                <input type="hidden" name="filename" value="{{ filename }}">
                <input type="hidden" name="dir_type" value="{{ dir_type }}">
            {% endif %}
            <textarea name="content" class="text-editor">{{ content }}</textarea>
            <div class="actions actions--end">
                <button type="submit" class="btn btn--success">保存</button>
                <button type="button" class="btn btn--secondary" onclick="window.location.href='{{ url_for('browse_files', dir_type='config') }}'">キャンセル</button>
            </div>
        </form>
    </div>
</body>
</html>
