<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PCD / PGM Map / Waypoint Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #viewer-container { width: 100vw; height: 100vh; position: relative; }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5em;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 100;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
            z-index: 10;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 3px;
            font-size: 0.9em;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #controls label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
    
    <script src="{{ url_for('static', filename='js/yaml/yaml.min.js') }}"></script>
</head>
<body>
    <div id="viewer-container"></div>
    <div id="loading-message">PCDファイルをロード中...</div>
    <div id="info"></div>
    
    <div id="controls">
        <label>
            <input type="checkbox" id="toggle-pcd" checked> 
            PCD (点群) を表示
        </label>
        <label>
            <input type="checkbox" id="toggle-pgm"> 
            PGM (マップ) を表示
        </label>
        <label>
            <input type="checkbox" id="toggle-waypoints" checked> 
            Waypoints を表示
        </label>
    </div>

    <script type="module">
        // 外部ライブラリのインポート (CDNのインポートマップを利用)
        import * as THREE from 'three';
        import { PCDLoader } from 'three/addons/loaders/PCDLoader.js'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 
        
        // Flaskから渡される変数 (Jinja2テンプレート構文)
        const mapName = '{{ map_name | default("") }}';
        const filename = mapName ? mapName + '.pcd' : '';
        const pcdUrl = filename ? '/map/' + filename : '';
        
        // Flaskから渡される YAML データ文字列
        const yamlDataString = `{{ yaml_data | default("") }}`; 
        
        // 🌟 修正済み: tojson | safe フィルターを適用し、JavaScriptの文字列リテラルとして安全に展開 🌟
        const waypointsDataString = `{{ waypoints_data | default("[]") | safe }}`;
        // PGMマップ用のグローバル変数
        let mapData = null; 
        let pgmUrl = ''; 
        let planeMesh = null; 
        
        // Waypoint 可視化用のグローバル変数
        let waypointsGroup = new THREE.Group(); // ウェイポイント全体をまとめるグループ
        let waypoints = []; // 解析されたウェイポイントデータ
        
        // Three.jsの標準変数
        let scene, camera, renderer, loader;
        let controls;
        let pointsMesh;
        const initialModel = { position: new THREE.Vector3(), rotation: new THREE.Euler() };

        // ----------------------------------------------------
        // PGMファイルのヘッダーを読み取り、ピクセルデータとして返すカスタムパーサー関数
        // ----------------------------------------------------
        async function parsePGM(url, mapData) { 
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch PGM file: ${response.statusText}`);
            }
            const buffer = await response.arrayBuffer();
            
            const decoder = new TextDecoder('ascii');
            
            let offset = 0;
            
            // 1. マジックナンバー (P5)
            let magicNumber = decoder.decode(new Uint8Array(buffer, offset, 2));
            if (magicNumber !== 'P5') {
                throw new Error(`Unsupported PGM format: ${magicNumber}. Only P5 (binary) is supported.`);
            }
            offset += 2;
            
            // 2. 幅、高さ、最大値を取得するためのヘッダー解析
            let headerText = '';
            let headerEndIndex = -1;
            
            for (let i = offset; i < buffer.byteLength; i++) {
                const charCode = new Uint8Array(buffer, i, 1)[0];
                const char = String.fromCharCode(charCode);

                if (char === '\n') {
                    const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
                    if (lines.length >= 2) {
                        headerEndIndex = i;
                        break;
                    }
                }
                headerText += char;
            }
            
            if (headerEndIndex === -1) {
                throw new Error("PGM header analysis failed.");
            }
            
            // 幅、高さ、最大値の抽出
            const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
            const dimensions = lines[0].trim().split(/\s+/).map(Number);
            const width = dimensions[0];
            const height = dimensions[1];
            const maxValue = 255; 
            
            if (!width || !height) {
                 throw new Error("PGM header data (width, height) is invalid.");
            }
            
            // 3. ピクセルデータ
            const pixelDataStart = headerEndIndex + 1;
            const pixelDataSize = width * height;
            const grayData = new Uint8Array(buffer, pixelDataStart, pixelDataSize);

            // 4. Three.jsテクスチャ用のRGBAデータに変換と色付け (視認性改善ロジック)
            const data = new Uint8Array(pixelDataSize * 4);
            
            const occupiedThresh = mapData.occupied_thresh || 0.65;
            const freeThresh = mapData.free_thresh || 0.196;
            
            // しきい値を 0-255 のグレースケール値に変換
            const occupiedGray = Math.round(occupiedThresh * maxValue);
            const freeGray = Math.round(freeThresh * maxValue);
            
            for (let i = 0; i < pixelDataSize; i++) {
                const gray = grayData[i];
                const offset = i * 4;

                if (gray <= occupiedGray) {
                    // 占有セル (障害物): 赤色で強調し、半不透明
                    data[offset] = 255;     // R
                    data[offset + 1] = 50;  // G
                    data[offset + 2] = 50;  // B
                    data[offset + 3] = 200; // A: 80% 不透明
                } else if (gray >= freeGray) {
                    // 自由セル (空き地): 薄い緑色で、半透明
                    data[offset] = 150;     // R
                    data[offset + 1] = 255; // G
                    data[offset + 2] = 150; // B
                    data[offset + 3] = 100; // A: 40% 不透明
                } else {
                    // 未知の領域 (中間色): 完全に透明
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0; // A: 完全に透明
                }
            }

            return { data, width, height, maxValue };
        }

        // ----------------------------------------------------
        // PGMマップのロードと配置関数
        // ----------------------------------------------------
        async function loadPGMMap() { 
            if (!pgmUrl || !mapData) {
                document.getElementById('toggle-pgm').closest('label').style.display = 'none';
                return;
            }
            
            // PGM_Z_OFFSET は 0.0 に設定 (PCDと同じ平面)
            const PGM_Z_OFFSET = 0.0; 
            
            const origin = mapData.origin; 
            const resolution = mapData.resolution; 
            const pgmImageName = mapData.image; 
            
            try {
                const pgmResult = await parsePGM(pgmUrl, mapData); 
                
                const imgWidth = pgmResult.width;
                const imgHeight = pgmResult.height;
                const mapWidth = imgWidth * resolution;
                const mapHeight = imgHeight * resolution;
                
                const texture = new THREE.DataTexture(
                    pgmResult.data, 
                    imgWidth, 
                    imgHeight, 
                    THREE.RGBAFormat 
                );
                
                texture.flipY = false; 
                texture.wrapS = THREE.ClampToEdgeWrapping; 
                texture.repeat.set(-1, 1);                  
                texture.offset.set(1, 0);                   
                texture.needsUpdate = true;
                
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.FrontSide, 
                    transparent: true,
                    opacity: 1.0, 
                });

                const geometry = new THREE.PlaneGeometry(mapWidth, mapHeight);
                
                planeMesh = new THREE.Mesh(geometry, material);
                
                planeMesh.rotation.x = 0; 
                planeMesh.rotation.y = 0; 
                planeMesh.rotation.z = -Math.PI; 

                const centerX = origin[0] + mapWidth / 2;  
                const centerY = origin[1] + mapHeight / 2; 

                planeMesh.position.set(
                    centerX,                          // X軸中心
                    centerY,                          // Y軸中心
                    PGM_Z_OFFSET                      // Z軸: 0.0
                ); 
                
                planeMesh.visible = false; // 初期状態では非表示

                scene.add(planeMesh);
                
                console.log(`PGMマップを配置しました: 中心 (${centerX.toFixed(2)}, ${centerY.toFixed(2)}, ${PGM_Z_OFFSET.toFixed(2)})`);

            } catch (error) {
                console.error('PGMファイルのロード/パース中にエラーが発生しました:', pgmUrl, error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">PGMパースエラー: ${pgmImageName}</span>`;
                document.getElementById('toggle-pgm').closest('label').style.display = 'none';
            }
        }
        
        // ----------------------------------------------------
        // Waypointのロードと配置関数
        // ----------------------------------------------------
        
        /**
         * ROS形式のクォータニオンからYaw角 (ラジアン) を計算するヘルパー関数
         */
        function quaternionToYaw(qx, qy, qz, qw) {
            // Z軸周りの回転 (Yaw) を抽出
            const siny_cosp = 2 * (qw * qz + qx * qy);
            const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
            return Math.atan2(siny_cosp, cosy_cosp);
        }

        /**
         * ウェイポイントファイルを解析し、シーンに可視化する関数
         */
        function loadWaypoints() {
            if (!waypointsDataString || waypointsDataString === '[]') {
                document.getElementById('toggle-waypoints').closest('label').style.display = 'none';
                return;
            }

            try {
                // JSONデータを解析
                const rawWaypoints = JSON.parse(waypointsDataString);
                
                if (rawWaypoints.length === 0) {
                    document.getElementById('toggle-waypoints').closest('label').style.display = 'none';
                    return;
                }

                waypoints = rawWaypoints;
                
                // Waypoint Z オフセットは 0.0 (PCD/PGMと同じ平面)
                const WAYPOINT_Z_OFFSET = 0.0; 
                
                waypoints.forEach((wp, index) => {
                    if (wp.length < 2) return; 

                    const position = wp[0]; // [x, y, z]
                    const orientation = wp[1]; // [qx, qy, qz, qw]
                    
                    const x = position[0];
                    const y = position[1];
                    const z = WAYPOINT_Z_OFFSET; 
                    
                    // クォータニオンからヨー角を抽出
                    const yaw = quaternionToYaw(orientation[0], orientation[1], orientation[2], orientation[3]);
                    
                    // 1. 位置を表す小さな球体 (Sphere)
                    const SPHERE_RADIUS = 0.3; // 半径0.3m
                    const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 16, 16); 
                    const material = new THREE.MeshBasicMaterial({ color: 0x00ffff }); // シアン
                    const sphere = new THREE.Mesh(geometry, material);
                    
                    sphere.position.set(x, y, z);
                    waypointsGroup.add(sphere);

                    // 2. 向きを表す矢印 (ArrowHelper)
                    const dir = new THREE.Vector3(1, 0, 0); 
                    dir.applyAxisAngle(new THREE.Vector3(0, 0, 1), yaw); // Z軸周りにYaw角だけ回転
                    
                    const origin = new THREE.Vector3(x, y, z);
                    const length = 1.0; // 矢印の長さ1.0m
                    const color = 0xffff00; // 黄色
                    
                    const arrowHelper = new THREE.ArrowHelper(dir, origin, length, color, 0.2, 0.15);

                    waypointsGroup.add(arrowHelper);
                });

                // ウェイポイントグループをシーンに追加
                scene.add(waypointsGroup);
                waypointsGroup.visible = true; // デフォルトで表示

                console.log(`ウェイポイントを ${waypoints.length} 個配置しました。`);

            } catch (error) {
                console.error('ウェイポイントファイルの解析中にエラーが発生しました:', error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">Waypointパースエラー</span>`;
                document.getElementById('toggle-waypoints').closest('label').style.display = 'none';
            }
        }

        // ----------------------------------------------------
        // 表示コントロールのセットアップ関数
        // ----------------------------------------------------
        function setupControls() {
            const togglePCD = document.getElementById('toggle-pcd');
            const togglePGM = document.getElementById('toggle-pgm');
            const toggleWaypoints = document.getElementById('toggle-waypoints');
            
            // PCD
            togglePCD.addEventListener('change', () => {
                if (pointsMesh) {
                    pointsMesh.visible = togglePCD.checked;
                }
            });

            // PGM
            if (planeMesh) {
                // HTMLでcheckedになっていない場合は、ここで初期状態を反映
                if (!togglePGM.checked) {
                    planeMesh.visible = false;
                }
                togglePGM.addEventListener('change', () => {
                    planeMesh.visible = togglePGM.checked;
                });
            } else {
                togglePGM.disabled = true;
                togglePGM.closest('label').style.opacity = 0.5;
            }

            // Waypoints
            if (waypointsGroup && waypoints.length > 0) {
                // デフォルトは HTML で checked = true
                toggleWaypoints.addEventListener('change', () => {
                    waypointsGroup.visible = toggleWaypoints.checked;
                });
            } else {
                toggleWaypoints.disabled = true;
                toggleWaypoints.closest('label').style.display = 'none';
            }
        }

        // ----------------------------------------------------
        // 初期化処理
        // ----------------------------------------------------

        function init() {
            if (!pcdUrl || mapName === '') { 
                document.getElementById('loading-message').textContent = "エラー: マップ名が指定されていません。";
                return;
            }
            
            // YAMLデータ解析 
            try {
                if (yamlDataString) {
                    if (typeof jsyaml === 'undefined' || typeof jsyaml.load !== 'function') {
                        throw new Error("js-yamlライブラリ (jsyaml.load) が見つかりません。");
                    }
                    mapData = jsyaml.load(yamlDataString); 
                
                    if (!mapData || !mapData.image) {
                         document.getElementById('info').textContent = "警告: YAMLデータに'image'キーがありません。PCDのみロードされます。";
                    } else {
                        pgmUrl = '/map/' + mapData.image; 
                        document.getElementById('info').textContent = `PCD: ${filename} / PGM: ${mapData.image} をロード中...`;
                    }
                } else {
                    document.getElementById('info').textContent = `PCD: ${filename} をロード中... (PGMデータなし)`;
                }
                
            } catch (e) {
                 console.error("YAML解析エラー:", e);
                 document.getElementById('loading-message').textContent = `エラー: YAMLデータの解析に失敗しました。詳細: ${e.message}`;
                 return;
            }
            // ------------------------------------

            const container = document.getElementById('viewer-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333); 

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.minDistance = 0.5;
            controls.maxDistance = 100;

            loader = new PCDLoader();

            // PCDファイルのロード
            loader.load(
                pcdUrl,
                function (points) {
                    pointsMesh = points;
                    
                    pointsMesh.position.set(0, 0, 0); 
                    pointsMesh.visible = true; 

                    if (pointsMesh.material.size) {
                        pointsMesh.material.size = 0.05; 
                    }
                    
                    scene.add(pointsMesh);

                    const pointCount = pointsMesh.geometry.attributes.position.count;
                    document.getElementById('info').innerHTML = `PCD: ${filename} (${pointCount} points)`;
                    if(mapData && mapData.image) {
                        document.getElementById('info').innerHTML += `<br>PGM: ${mapData.image}`;
                    }

                    pointsMesh.geometry.computeBoundingSphere();
                    const center = pointsMesh.geometry.boundingSphere.center;
                    camera.position.set(center.x + 5, center.y + 5, center.z + 5);
                    controls.target.copy(center); 
                    
                    initialModel.position.copy(pointsMesh.position);
                    initialModel.rotation.copy(pointsMesh.rotation);

                    // PGMマップのロードと配置
                    if (pgmUrl && mapData) {
                        loadPGMMap();
                    }
                    
                    // ウェイポイントのロードと配置
                    loadWaypoints();
                    
                    document.getElementById('loading-message').style.display = 'none';
                    setupControls();
                    controls.update();
                    animate();
                },
                function (xhr) {
                    const percent = (xhr.loaded / xhr.total) * 100;
                    document.getElementById('loading-message').textContent = `PCDファイルをロード中... ${Math.round(percent)}%`;
                },
                function (error) {
                    console.error('PCDファイルのロード中にエラーが発生しました:', error);
                    document.getElementById('loading-message').textContent = `エラー: PCDファイルのロードに失敗しました。(${filename})`;
                }
            );

            window.addEventListener('resize', onWindowResize, false);
        }

        // ----------------------------------------------------
        // アニメーション/ユーティリティ関数
        // ----------------------------------------------------

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
