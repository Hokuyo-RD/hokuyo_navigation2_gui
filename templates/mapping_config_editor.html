<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マッピング設定の編集: {{ config_file }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="{{ url_for('static', filename='js/config_editor.js') }}"></script>
</head>
<body class="page">
    <div class="container container--wide">
        <h1>マッピング設定の編集: {{ config_file }}</h1>

        <div class="field">
            <label for="reference-bag">トピック名・座標系の候補にするROS Bag:</label>
            <select id="reference-bag">
                <option value="">-- 選択しない（候補なしで編集） --</option>
                {% for bag in rosbags %}
                <option value="{{ bag.path }}" {% if bag.path == selected_bag %}selected{% endif %}>{{ bag.name }}</option>
                {% endfor %}
            </select>
            <p class="note">
                ROS Bag を選ぶと、そこに記録されているトピック名と座標系が各項目の候補になります。
                <span class="text-success">緑</span>は型が合っている／座標系が一致している候補、
                <span class="text-error">赤</span>はそのROS Bagに存在しない値です。
            </p>
        </div>

        <div id="config-editor-body">
            <p class="text-muted">読み込んでいます…</p>
        </div>
        <p id="config-save-message" class="note"></p>

        <div class="actions actions--end">
            <button type="button" class="btn btn--secondary"
                    onclick="window.location.href='{{ url_for('browse_files', dir_type='config') }}'">
                ファイル一覧に戻る
            </button>
        </div>
    </div>

    <script>
        // 編集対象は1ファイルに決まっているため、選択プルダウンは使わず
        // configFile でファイル名を直接渡す（config_editor.js）。
        const referenceBag = document.getElementById('reference-bag');
        const pageHeading = document.querySelector('h1');
        const configEditorInstance = ConfigEditor.create({
            configFile: {{ config_file | tojson }},
            // 新規作成時に参考にしたROS Bagを引き継ぎ、そのまま候補を出す。
            bagPath: referenceBag.value,
            bodyElement: document.getElementById('config-editor-body'),
            messageElement: document.getElementById('config-save-message'),
            // 別名で保存すると以後はそのファイルが編集対象になるので、
            // 見出しも新しいファイル名に合わせる。
            onSaved: function (savedName) {
                pageHeading.textContent = 'マッピング設定の編集: ' + savedName;
                document.title = 'マッピング設定の編集: ' + savedName;
            }
        });

        referenceBag.addEventListener('change', () => {
            configEditorInstance.setBagPath(referenceBag.value);
            configEditorInstance.reload();
        });

        configEditorInstance.reload();
    </script>
</body>
</html>
