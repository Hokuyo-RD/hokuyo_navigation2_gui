<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PCD / PGM Map Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #viewer-container { width: 100vw; height: 100vh; position: relative; }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5em;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 100;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
            z-index: 10;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
    
    <script src="{{ url_for('static', filename='js/yaml/yaml.min.js') }}"></script>
</head>
<body>
    <div id="viewer-container"></div>
    <div id="loading-message">PCDファイルをロード中...</div>
    <div id="info"></div>

    <script type="module">
        // 外部ライブラリのインポート (CDNのインポートマップを利用)
        import * as THREE from 'three';
        import { PCDLoader } from 'three/addons/loaders/PCDLoader.js'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 
        
        // Flaskから渡される変数 (Jinja2テンプレート構文)
        const mapName = '{{ map_name | default("") }}';
        const filename = mapName ? mapName + '.pcd' : '';
        const pcdUrl = filename ? '/map/' + filename : '';
        
        // Flaskから渡される YAML データ文字列
        const yamlDataString = `{{ yaml_data | default("") }}`; 
        
        // PGMマップ用のグローバル変数
        let mapData = null; 
        let pgmUrl = ''; 
        let planeMesh = null; 
        
        // Three.jsの標準変数
        let scene, camera, renderer, loader;
        let controls;
        let pointsMesh;
        const initialModel = { position: new THREE.Vector3(), rotation: new THREE.Euler() };

        // ----------------------------------------------------
        // PGMファイルのヘッダーを読み取り、ピクセルデータとして返すカスタムパーサー関数
        // ----------------------------------------------------
        async function parsePGM(url, mapData) { 
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch PGM file: ${response.statusText}`);
            }
            const buffer = await response.arrayBuffer();
            
            const decoder = new TextDecoder('ascii');
            
            let offset = 0;
            
            // 1. マジックナンバー (P5)
            let magicNumber = decoder.decode(new Uint8Array(buffer, offset, 2));
            if (magicNumber !== 'P5') {
                throw new Error(`Unsupported PGM format: ${magicNumber}. Only P5 (binary) is supported.`);
            }
            offset += 2;
            
            // 2. 幅、高さ、最大値を取得するためのヘッダー解析
            let headerText = '';
            let headerEndIndex = -1;
            
            for (let i = offset; i < buffer.byteLength; i++) {
                const charCode = new Uint8Array(buffer, i, 1)[0];
                const char = String.fromCharCode(charCode);

                if (char === '\n') {
                    const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
                    if (lines.length >= 2) {
                        headerEndIndex = i;
                        break;
                    }
                }
                headerText += char;
            }
            
            if (headerEndIndex === -1) {
                throw new Error("PGM header analysis failed.");
            }
            
            // 幅、高さ、最大値の抽出
            const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
            const dimensions = lines[0].trim().split(/\s+/).map(Number);
            const width = dimensions[0];
            const height = dimensions[1];
            const maxValue = 255; 
            
            if (!width || !height) {
                 throw new Error("PGM header data (width, height) is invalid.");
            }
            
            // 3. ピクセルデータ
            const pixelDataStart = headerEndIndex + 1;
            const pixelDataSize = width * height;
            const grayData = new Uint8Array(buffer, pixelDataStart, pixelDataSize);

            // 4. Three.jsテクスチャ用のRGBAデータに変換と色付け (視認性改善ロジック)
            const data = new Uint8Array(pixelDataSize * 4);
            
            const occupiedThresh = mapData.occupied_thresh || 0.65;
            const freeThresh = mapData.free_thresh || 0.196;
            
            // しきい値を 0-255 のグレースケール値に変換
            const occupiedGray = Math.round(occupiedThresh * maxValue);
            const freeGray = Math.round(freeThresh * maxValue);
            
            for (let i = 0; i < pixelDataSize; i++) {
                const gray = grayData[i];
                const offset = i * 4;

                if (gray <= occupiedGray) {
                    // 占有セル (障害物): 赤色で強調し、半不透明
                    data[offset] = 255;     // R
                    data[offset + 1] = 50;  // G
                    data[offset + 2] = 50;  // B
                    data[offset + 3] = 200; // A: 80% 不透明
                } else if (gray >= freeGray) {
                    // 自由セル (空き地): 薄い緑色で、半透明
                    data[offset] = 150;     // R
                    data[offset + 1] = 255; // G
                    data[offset + 2] = 150; // B
                    data[offset + 3] = 100; // A: 40% 不透明
                } else {
                    // 未知の領域 (中間色): 完全に透明
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0; // A: 完全に透明
                }
            }

            return { data, width, height, maxValue };
        }

        // ----------------------------------------------------
        // PGMマップのロードと配置関数
        // ----------------------------------------------------

        /**
         * PGMファイルをロードし、2Dマップとしてシーンに追加する関数
         */
        async function loadPGMMap() { 
            if (!pgmUrl || !mapData) {
                document.getElementById('loading-message').style.display = 'none';
                return;
            }
            
            // 🌟 Z軸方向の固定オフセット (PCDとの重なり防止用) 🌟
            const PGM_Y_OFFSET = 0.0; 
            
            const origin = mapData.origin; 
            const resolution = mapData.resolution; 
            const pgmImageName = mapData.image; 
            
            try {
                // カスタムパーサーと色付けロジックを使用してデータを取得
                const pgmResult = await parsePGM(pgmUrl, mapData); 
                
                const imgWidth = pgmResult.width;
                const imgHeight = pgmResult.height;
                
                // 1. ワールド座標系でのマップのサイズを計算 (配置の原点計算には使用しませんが、ジオメトリサイズに必要)
                const mapWidth = imgWidth * resolution;
                const mapHeight = imgHeight * resolution;
                
                // データテクスチャの作成... (中略)
                const texture = new THREE.DataTexture(
                    pgmResult.data, 
                    imgWidth, 
                    imgHeight, 
                    THREE.RGBAFormat 
                );
                
                // 垂直方向の反転を無効にする (裏表修正 - 縦方向)
                texture.flipY = false; 
                
                // 水平方向の反転 (左右反転)
                texture.wrapS = THREE.ClampToEdgeWrapping; // 繰り返し設定をエッジに固定
                texture.repeat.set(-1, 1);                  // U座標 (水平方向) のスケールを -1 で反転
                texture.offset.set(1, 0);                   // 反転によるズレをオフセット 1 で修正

                texture.needsUpdate = true;
                
                // 3. マテリアルとジオメトリを作成
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.FrontSide, 
                    transparent: true,
                    opacity: 1.0, 
                });

                // 幅: mapWidth, 高さ: mapHeight の平面ジオメトリを作成
                const geometry = new THREE.PlaneGeometry(mapWidth, mapHeight);
                
                planeMesh = new THREE.Mesh(geometry, material);
                
                // 4. 平面の位置と回転の設定
                // 元の回転設定 (X=0, Y=0, Z=-PI)
                planeMesh.rotation.x = 0; 
                planeMesh.rotation.y = 0; 
                planeMesh.rotation.z = -Math.PI; 

                // グローバル座標系でのマップの中心位置を計算します。
                // Three.jsのPlaneGeometryの中心は (0, 0) なので、その中心をグローバル座標系の中心に合わせる。
                const centerX = origin[0] + mapWidth / 2;  // origin_x + (W * R / 2)
                const centerY = origin[1] + mapHeight / 2; // origin_y + (H * R / 2) - PGMのY軸はThree.jsのY軸に対応

                // 🌟 修正点 🌟: 位置を Three.js シーンの原点 (0, 0, 0) に固定します。
                planeMesh.position.set(
                    centerX,                          // X軸中心
                    centerY,                          // Y軸中心
                    0                                 // Z軸: 0 に固定
                ); 

                // 5. シーンに追加
                scene.add(planeMesh);
                
                console.log(`PGMマップの配置位置を強制的に (0, ${PGM_Y_OFFSET.toFixed(2)}, 0) に固定しました。`);
                document.getElementById('loading-message').style.display = 'none';

            } catch (error) {
                console.error('PGMファイルのロード/パース中にエラーが発生しました:', pgmUrl, error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">PGMパースエラー: ${pgmImageName}</span>`;
                document.getElementById('loading-message').style.display = 'none';
            }
        }
        
        // ----------------------------------------------------
        // 初期化処理
        // ----------------------------------------------------

        function init() {
            if (!pcdUrl || mapName === '') { 
                document.getElementById('loading-message').textContent = "エラー: マップ名が指定されていません。";
                return;
            }
            
            // YAMLデータ解析 
            try {
                if (yamlDataString) {
                    if (typeof jsyaml === 'undefined' || typeof jsyaml.load !== 'function') {
                        throw new Error("js-yamlライブラリ (jsyaml.load) が見つかりません。");
                    }
                    mapData = jsyaml.load(yamlDataString); 
                
                    if (!mapData || !mapData.image) {
                         document.getElementById('info').textContent = "警告: YAMLデータに'image'キーがありません。PGMマップはロードされません。";
                    } else {
                        pgmUrl = '/map/' + mapData.image; 
                        document.getElementById('info').textContent = `PCD: ${filename} / PGM: ${mapData.image} をロード中...`;
                    }
                } else {
                    document.getElementById('info').textContent = `PCD: ${filename} をロード中... (PGMデータなし)`;
                }
                
            } catch (e) {
                 console.error("YAML解析エラー:", e);
                 document.getElementById('loading-message').textContent = `エラー: YAMLデータの解析に失敗しました。詳細: ${e.message}`;
                 return;
            }
            // ------------------------------------

            const container = document.getElementById('viewer-container');
            
            // シーンの作成
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333); 

            // カメラの作成
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5); 

            // レンダラーの作成
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // コントロールの作成
            controls = new OrbitControls(camera, renderer.domElement);
            controls.minDistance = 0.5;
            controls.maxDistance = 100;

            // ローダーの作成
            loader = new PCDLoader();

            // PCDファイルのロード
            loader.load(
                pcdUrl,
                // ロード成功時のコールバック
                function (points) {
                    pointsMesh = points;
                    
                    // PCD は既にグローバル座標系にあるとみなし、位置補正を適用しない
                    pointsMesh.position.set(0, 0, 0); 
                    
                    // 視認性改善: 点群のサイズを大きくします
                    if (pointsMesh.material.size) {
                        pointsMesh.material.size = 0.05; // 調整可能
                    }
                    
                    scene.add(pointsMesh);

                    const pointCount = pointsMesh.geometry.attributes.position.count;
                    document.getElementById('info').innerHTML = `PCD: ${filename} (${pointCount} points)`;
                    if(mapData && mapData.image) {
                        document.getElementById('info').innerHTML += `<br>PGM: ${mapData.image}`;
                    }

                    // カメラをモデルの中心に合わせる
                    pointsMesh.geometry.computeBoundingSphere();
                    const center = pointsMesh.geometry.boundingSphere.center;
                    camera.position.set(center.x + 5, center.y + 5, center.z + 5);
                    controls.target.copy(center); 
                    
                    initialModel.position.copy(pointsMesh.position);
                    initialModel.rotation.copy(pointsMesh.rotation);

                    // PGMマップのロードと配置ロジックを開始 (非同期)
                    if (pgmUrl && mapData) {
                        loadPGMMap();
                    } else {
                        document.getElementById('loading-message').style.display = 'none';
                    }
                    
                    controls.update();
                    animate();
                },
                // ロード進捗時のコールバック
                function (xhr) {
                    const percent = (xhr.loaded / xhr.total) * 100;
                    document.getElementById('loading-message').textContent = `PCDファイルをロード中... ${Math.round(percent)}%`;
                },
                // ロードエラー時のコールバック
                function (error) {
                    console.error('PCDファイルのロード中にエラーが発生しました:', error);
                    document.getElementById('loading-message').textContent = `エラー: PCDファイルのロードに失敗しました。(${filename})`;
                }
            );

            // リサイズイベントリスナー
            window.addEventListener('resize', onWindowResize, false);
        }

        // ----------------------------------------------------
        // アニメーション/ユーティリティ関数
        // ----------------------------------------------------

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
