<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PCD / PGM Map / Waypoint Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        #viewer-container { width: 100vw; height: 100vh; position: relative; }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5em;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 100;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9em;
            z-index: 10;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 3px;
            font-size: 0.9em;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #controls label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
    
    <script src="{{ url_for('static', filename='js/yaml/yaml.min.js') }}"></script>
</head>
<body>
    <div id="viewer-container"></div>
    <div id="loading-message">マップ名を指定してロードしてください。</div>
    <div id="info"></div>
    
    <div id="controls">
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="map-name-input">マップ名 (例: my_map):</label>
            <input type="text" id="map-name-input" value="{{ map_name | default("") }}" style="padding: 5px;">
            <button id="load-map-button" style="padding: 5px;">ロード</button>
        </div>
        
        <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">

        <label>
            <input type="checkbox" id="toggle-pcd" checked> 
            PCD (点群) を表示
        </label>
        <label>
            <input type="checkbox" id="toggle-pgm"> 
            PGM (マップ) を表示
        </label>
        <label>
            <input type="checkbox" id="toggle-waypoints" checked> 
            Waypoints を表示
        </label>
        
        <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">

        <button onclick="unloadMap('pcd')" style="padding: 5px;">PCD アンロード</button>
        <button onclick="unloadMap('pgm')" style="padding: 5px;">PGM/YAML アンロード</button>
        <button onclick="unloadMap('waypoints')" style="padding: 5px;">Waypoint アンロード</button>

    </div>

    <script type="module">
        // 外部ライブラリのインポート (CDNのインポートマップを利用)
        import * as THREE from 'three';
        import { PCDLoader } from 'three/addons/loaders/PCDLoader.js'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 
        
        // Waypoint 可視化用のグローバル変数
        let waypointsGroup = new THREE.Group(); 
        let waypoints = []; 
        
        // PGMマップ用のグローバル変数
        let mapData = null; 
        let planeMesh = null; 
        let currentMapName = '{{ map_name | default("") }}'; // 現在ロード中のマップ名を保持
        
        // Three.jsの標準変数
        let scene, camera, renderer, loader;
        let controls;
        let pointsMesh;
        const initialModel = { position: new THREE.Vector3(), rotation: new THREE.Euler() };

        // ----------------------------------------------------
        // ROS形式のクォータニオンからYaw角 (ラジアン) を計算するヘルパー関数
        // ----------------------------------------------------
        function quaternionToYaw(qx, qy, qz, qw) {
            const siny_cosp = 2 * (qw * qz + qx * qy);
            const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
            return Math.atan2(siny_cosp, cosy_cosp);
        }

        // ----------------------------------------------------
        // PGMファイルのヘッダーを読み取り、ピクセルデータとして返すカスタムパーサー関数
        // ----------------------------------------------------
        async function parsePGM(urlOrBuffer, mapData) {
            let buffer;
            if (typeof urlOrBuffer === 'string') {
                const response = await fetch(urlOrBuffer);
                if (!response.ok) {
                    throw new Error(`Failed to fetch PGM file: ${response.statusText}`);
                }
                buffer = await response.arrayBuffer();
            } else {
                buffer = urlOrBuffer;
            }

            const decoder = new TextDecoder('ascii');
            let offset = 0;
            
            // 1. マジックナンバー (P5)
            let magicNumber = decoder.decode(new Uint8Array(buffer, offset, 2));
            if (magicNumber !== 'P5') {
                throw new Error(`Unsupported PGM format: ${magicNumber}. Only P5 (binary) is supported.`);
            }
            offset += 2;
            
            // 2. 幅、高さ、最大値を取得するためのヘッダー解析
            let headerText = '';
            let headerEndIndex = -1;
            
            for (let i = offset; i < buffer.byteLength; i++) {
                const charCode = new Uint8Array(buffer, i, 1)[0];
                const char = String.fromCharCode(charCode);

                if (char === '\n') {
                    const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
                    if (lines.length >= 2) {
                        headerEndIndex = i;
                        break;
                    }
                }
                headerText += char;
            }
            
            if (headerEndIndex === -1) {
                throw new Error("PGM header analysis failed.");
            }
            
            // 幅、高さ、最大値の抽出
            const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
            const dimensions = lines[0].trim().split(/\s+/).map(Number);
            const width = dimensions[0];
            const height = dimensions[1];
            const maxValue = 255; 
            
            if (!width || !height) {
                 throw new Error("PGM header data (width, height) is invalid.");
            }
            
            // 3. ピクセルデータ
            const pixelDataStart = headerEndIndex + 1;
            const pixelDataSize = width * height;
            const grayData = new Uint8Array(buffer, pixelDataStart, pixelDataSize);

            // 4. Three.jsテクスチャ用のRGBAデータに変換と色付け (視認性改善ロジック)
            const data = new Uint8Array(pixelDataSize * 4);
            
            const occupiedThresh = mapData.occupied_thresh || 0.65;
            const freeThresh = mapData.free_thresh || 0.196;
            
            // しきい値を 0-255 のグレースケール値に変換
            const occupiedGray = Math.round(occupiedThresh * maxValue);
            const freeGray = Math.round(freeThresh * maxValue);
            
            for (let i = 0; i < pixelDataSize; i++) {
                const gray = grayData[i];
                const offset = i * 4;

                if (gray <= occupiedGray) {
                    // 占有セル (障害物): 赤色で強調し、半不透明
                    data[offset] = 255;     // R
                    data[offset + 1] = 50;  // G
                    data[offset + 2] = 50;  // B
                    data[offset + 3] = 200; // A: 80% 不透明
                } else if (gray >= freeGray) {
                    // 自由セル (空き地): 薄い緑色で、半透明
                    data[offset] = 150;     // R
                    data[offset + 1] = 255; // G
                    data[offset + 2] = 150; // B
                    data[offset + 3] = 100; // A: 40% 不透明
                } else {
                    // 未知の領域 (中間色): 完全に透明
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0; // A: 完全に透明
                }
            }

            return { data, width, height, maxValue };
        }
        
        // ----------------------------------------------------
        // PGMマップのロードと配置関数 (サーバーから画像を取得)
        // ----------------------------------------------------
        async function loadPGMMap() { 
            const togglePGM = document.getElementById('toggle-pgm');
            const togglePGMLabel = togglePGM.closest('label');
            
            unloadMap('pgm'); // ロード前に必ずアンロード

            if (!mapData || !mapData.image) {
                console.warn("YAMLデータが存在しないか、'image'キーがありません。PGMロードをスキップします。");
                togglePGMLabel.style.display = 'none';
                return;
            }
            
            const pgmUrl = '/map/' + mapData.image; // サーバーのURLを構築
            const PGM_Z_OFFSET = 0.0; 
            const origin = mapData.origin; 
            const resolution = mapData.resolution; 
            const pgmImageName = mapData.image; 
            
            try {
                // サーバーからPGM画像ファイルをfetchする
                const pgmResult = await parsePGM(pgmUrl, mapData); 
                
                const imgWidth = pgmResult.width;
                const imgHeight = pgmResult.height;
                const mapWidth = imgWidth * resolution;
                const mapHeight = imgHeight * resolution;
                
                const texture = new THREE.DataTexture(
                    pgmResult.data, 
                    imgWidth, 
                    imgHeight, 
                    THREE.RGBAFormat 
                );
                
                texture.flipY = false; 
                texture.wrapS = THREE.ClampToEdgeWrapping; 
                texture.repeat.set(-1, 1);                  
                texture.offset.set(1, 0);                   
                texture.needsUpdate = true;
                
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.FrontSide, 
                    transparent: true,
                    opacity: 1.0, 
                });

                const geometry = new THREE.PlaneGeometry(mapWidth, mapHeight);
                
                planeMesh = new THREE.Mesh(geometry, material);
                
                planeMesh.rotation.x = 0; 
                planeMesh.rotation.y = 0; 
                planeMesh.rotation.z = -Math.PI; 

                const centerX = origin[0] + mapWidth / 2;  
                const centerY = origin[1] + mapHeight / 2; 

                planeMesh.position.set(
                    centerX,                          // X軸中心
                    centerY,                          // Y軸中心
                    PGM_Z_OFFSET                      // Z軸: 0.0
                ); 
                
                planeMesh.visible = togglePGM.checked; // ロード時のチェックボックスの状態を反映

                scene.add(planeMesh);
                
                document.getElementById('info').innerHTML += `<br>PGM: ${pgmImageName} 配置完了`;
                console.log(`PGMマップを配置しました: 中心 (${centerX.toFixed(2)}, ${centerY.toFixed(2)}, ${PGM_Z_OFFSET.toFixed(2)})`);

                // コントロールを有効化
                togglePGMLabel.style.display = 'flex'; // 表示に戻す
                togglePGM.disabled = false;
                togglePGMLabel.style.opacity = 1.0; 

                // NOTE: PGMトグルのリスナー設定は init() で一度だけ行われているため、ここでは不要

            } catch (error) {
                console.error('PGMファイルのロード/パース中にエラーが発生しました:', pgmUrl, error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">PGMロードエラー: ${error.message}</span>`;
                togglePGMLabel.style.display = 'none'; 
            }
        }
        
        // ----------------------------------------------------
        // PCDロード関数 (サーバーから ArrayBuffer を取得)
        // ----------------------------------------------------
        async function loadPCD(mapName) {
            const pcdUrl = `/map/${mapName}.pcd`;
            
            unloadMap('pcd'); // ロード前に必ずアンロード
            document.getElementById('loading-message').textContent = `PCDファイル (${mapName}.pcd) をロード中...`;
            document.getElementById('loading-message').style.display = 'block';

            try {
                const response = await fetch(pcdUrl);
                if (!response.ok) {
                    throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                }
                
                const buffer = await response.arrayBuffer();
                const filename = `${mapName}.pcd`;

                // PCDLoader の parse メソッドを使用して ArrayBuffer から直接ロード
                const points = loader.parse(buffer);
                
                pointsMesh = points;
                pointsMesh.position.set(0, 0, 0); 
                pointsMesh.visible = document.getElementById('toggle-pcd').checked;

                if (pointsMesh.material.size) {
                    pointsMesh.material.size = 0.05; 
                }
                
                scene.add(pointsMesh);
                
                // カメラ位置調整
                pointsMesh.geometry.computeBoundingSphere();
                const center = pointsMesh.geometry.boundingSphere.center;
                camera.position.set(center.x + 5, center.y + 5, center.z + 5);
                controls.target.copy(center); 
                controls.update();

                const pointCount = pointsMesh.geometry.attributes.position.count;
                document.getElementById('info').innerHTML = `PCD: ${filename} (${pointCount} points)`;
                document.getElementById('loading-message').style.display = 'none';

                // ロード成功時に PCD トグルを再表示
                const togglePCDLabel = document.getElementById('toggle-pcd').closest('label');
                togglePCDLabel.style.display = 'flex';

            } catch (error) {
                console.error('PCDファイルのロード中にエラーが発生しました:', error);
                document.getElementById('loading-message').textContent = `エラー: PCDロード失敗 (${mapName}.pcd): ${error.message}`;
                document.getElementById('info').innerHTML = `PCDロード失敗: ${error.message}`;
            }
        }

        // ----------------------------------------------------
        // YAMLロード関数 (サーバーからテキストを取得)
        // ----------------------------------------------------
        async function loadYAML(mapName) {
            const yamlUrl = `/map/${mapName}.yaml`;
            
            unloadMap('pgm'); // ロード前に必ずアンロード
            
            try {
                const response = await fetch(yamlUrl);
                if (!response.ok) {
                    throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                }
                
                const yamlText = await response.text();
                mapData = jsyaml.load(yamlText); 
                
                document.getElementById('info').innerHTML += `<br>YAML: ${mapName}.yaml ロード完了`;
                
                // PGMマップのロードを開始
                await loadPGMMap();

            } catch (error) {
                console.error('YAMLファイルのロード中にエラーが発生しました:', error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">YAMLロード失敗: ${error.message}</span>`;
            }
        }

        // ----------------------------------------------------
        // Waypointロード関数 (サーバーから JSON を取得)
        // ----------------------------------------------------
        async function loadWaypoints(mapName) {
            // パスは `/map/` または `/waypoints/` をサーバー設定に合わせてください
            const jsonUrl = `/map/${mapName}.json`; 
            
            unloadMap('waypoints'); // ロード前に必ずアンロード
            const toggleWaypoints = document.getElementById('toggle-waypoints');
            const toggleWaypointsLabel = toggleWaypoints.closest('label');
            toggleWaypointsLabel.style.display = 'flex'; // ロードに成功する可能性があるので再表示

            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) {
                    throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                }
                
                const rawWaypoints = await response.json(); // JSONを直接パース

                if (rawWaypoints.length === 0) {
                    throw new Error("ウェイポイントファイルが空です。");
                }

                waypoints = rawWaypoints;
                
                // Waypoint Z オフセットは 0.0 
                const WAYPOINT_Z_OFFSET = 0.0; 
                
                waypoints.forEach((wp, index) => {
                    if (wp.length < 2) return; 

                    const position = wp[0]; // [x, y, z]
                    const orientation = wp[1]; // [qx, qy, qz, qw]
                    
                    const x = position[0];
                    const y = position[1];
                    const z = WAYPOINT_Z_OFFSET; 
                    
                    const yaw = quaternionToYaw(orientation[0], orientation[1], orientation[2], orientation[3]);
                    
                    const SPHERE_RADIUS = 0.3; 
                    const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 16, 16); 
                    const material = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
                    const sphere = new THREE.Mesh(geometry, material);
                    
                    sphere.position.set(x, y, z);
                    waypointsGroup.add(sphere);

                    const dir = new THREE.Vector3(1, 0, 0); 
                    dir.applyAxisAngle(new THREE.Vector3(0, 0, 1), yaw); 
                    
                    const origin = new THREE.Vector3(x, y, z);
                    const length = 1.0; 
                    const color = 0xffff00; 
                    
                    const arrowHelper = new THREE.ArrowHelper(dir, origin, length, color, 0.2, 0.15);

                    waypointsGroup.add(arrowHelper);
                });

                scene.add(waypointsGroup);
                waypointsGroup.visible = toggleWaypoints.checked;

                document.getElementById('info').innerHTML += `<br>Waypointを ${waypoints.length} 個配置完了`;
                
                // コントロールを有効化
                toggleWaypointsLabel.style.display = 'flex';
                
                // NOTE: Waypointトグルのリスナー設定は init() で一度だけ行われているため、ここでは不要
                
            } catch (error) {
                console.error('Waypointファイルのロード中にエラーが発生しました:', error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">Waypointロード失敗: ${error.message}</span>`;
                toggleWaypointsLabel.style.display = 'none';
            }
        }

// ----------------------------------------------------
        // アンロード関数 (グローバルスコープ)
        // ----------------------------------------------------
        window.unloadMap = function(type) {
            switch(type) {
                case 'pcd':
                    // PCD トグル要素とそのラベルを取得
                    const togglePCD = document.getElementById('toggle-pcd');
                    const togglePCDLabel = togglePCD.closest('label'); // <label> 要素を取得

                    if (pointsMesh) {
                        scene.remove(pointsMesh);
                        pointsMesh.geometry.dispose();
                        pointsMesh.material.dispose();
                        pointsMesh = null; // PCD メッシュをクリア
                        
                        document.getElementById('info').innerHTML = "PCD アンロード完了";
                        
                        // PGM と Waypoint の連鎖的なアンロードは行わない (前の指示通り)
                    }
                    
                    // ★★★ 修正箇所 ★★★
                    // PCDをアンロードしたらチェックボックスを非表示にする
                    togglePCDLabel.style.display = 'none';
                    
                    // PGMとWaypointが残っている可能性があるため、
                    // これらのトグルが表示状態であれば、チェックを外す (任意だが推奨)
                    document.getElementById('toggle-pgm').checked = false;
                    document.getElementById('toggle-waypoints').checked = false;
                    
                    break;
                case 'pgm':
                    const togglePGMLabel = document.getElementById('toggle-pgm').closest('label');
                    if (planeMesh) {
                        scene.remove(planeMesh);
                        planeMesh.geometry.dispose();
                        if (planeMesh.material.map) planeMesh.material.map.dispose();
                        planeMesh.material.dispose();
                        planeMesh = null; // PGMをアンロードしたら null に設定
                        mapData = null; // YAMLデータもクリア
                        document.getElementById('info').innerHTML += "<br>PGM/YAML アンロード完了";
                    }
                    togglePGMLabel.style.display = 'none';
                    break;
                case 'waypoints':
                    const toggleWaypointsLabel = document.getElementById('toggle-waypoints').closest('label');
                    if (waypointsGroup) {
                        scene.remove(waypointsGroup);
                        waypointsGroup.children.forEach(child => {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) child.material.dispose();
                        });
                        waypointsGroup = new THREE.Group(); // Waypointsをアンロードしたら新しいGroupに設定
                        waypoints = [];
                        document.getElementById('info').innerHTML += "<br>Waypoint アンロード完了";
                    }
                    toggleWaypointsLabel.style.display = 'none';
                    break;
            }
        }
        
        // ----------------------------------------------------
        // ロード開始関数
        // ----------------------------------------------------
        async function startLoadProcess() {
            const mapNameInput = document.getElementById('map-name-input');
            const mapName = mapNameInput.value.trim();

            if (!mapName) {
                alert("マップ名を入力してください。");
                return;
            }
            
            currentMapName = mapName;
            
            document.getElementById('loading-message').textContent = `マップ '${mapName}' のファイルをロード中...`;
            document.getElementById('loading-message').style.display = 'block';
            document.getElementById('info').innerHTML = `ロード開始: ${mapName}`;
            
            // 既存の要素をすべてアンロード
            unloadMap('pcd');
            
            // 1. PCDをロード
            await loadPCD(mapName);

            // 2. YAML (PGMメタデータ) をロードし、PGM画像もロード
            await loadYAML(mapName);
            
            // 3. Waypoint (JSON) をロード
            await loadWaypoints(mapName);
            
            document.getElementById('loading-message').style.display = 'none';
        }

        // ----------------------------------------------------
        // 初期化処理
        // ----------------------------------------------------
        function init() {
            const container = document.getElementById('viewer-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333); 

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.minDistance = 0.5;
            controls.maxDistance = 100;
            controls.target.set(0, 0, 0); 
            controls.update();

            loader = new PCDLoader();
            
            window.addEventListener('resize', onWindowResize, false);
            
            // ロードボタンにイベントリスナーを設定
            document.getElementById('load-map-button').addEventListener('click', startLoadProcess);
            
            // 🌟 PGM/Waypoint/PCD トグルイベントリスナーを init で一度だけ設定 🌟
            // このブロックはロード/アンロードサイクル全体で永続的に動作します。
            
            const togglePCD = document.getElementById('toggle-pcd');
            togglePCD.addEventListener('change', () => {
                // pointsMesh が存在する場合にのみ可視性を切り替える
                if (pointsMesh) { 
                    pointsMesh.visible = togglePCD.checked;
                }
            });

            const togglePGM = document.getElementById('toggle-pgm');
            togglePGM.addEventListener('change', () => {
                if (planeMesh) { 
                    planeMesh.visible = togglePGM.checked;
                }
            });

            const toggleWaypoints = document.getElementById('toggle-waypoints');
            toggleWaypoints.addEventListener('change', () => {
                if (waypointsGroup) {
                    waypointsGroup.visible = toggleWaypoints.checked;
                }
            });
            
            // 初期状態でPGMとWaypointのトグルを非表示に（ロード成功後に表示する）
            document.getElementById('toggle-pcd').closest('label').style.display = 'none'; // PCDを追加
            document.getElementById('toggle-pgm').closest('label').style.display = 'none';
            document.getElementById('toggle-waypoints').closest('label').style.display = 'none';
            
            // 初期マップ名が設定されていれば自動ロード
            if (currentMapName) {
                startLoadProcess();
            } else {
                document.getElementById('loading-message').style.display = 'block';
            }

            // アニメーションループ開始
            animate();
        }

        // ----------------------------------------------------
        // アニメーション/ユーティリティ関数
        // ----------------------------------------------------

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
