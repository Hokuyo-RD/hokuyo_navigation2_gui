<div class="single_map-run-popup-content">
    <p>自律移動の開始前に設定を確認してください。</p>
    <form id="single_mapRunForm" method="post" action="/gui" target="_blank">
        <div id="checklist-container">
            <div><input type="checkbox" id="check1_single_map" name="check1_single_map" value="checked"><label for="check1_single_map">一時停止スイッチをオンしていること</label></div>
            <div><input type="checkbox" id="check2_single_map" name="check2_single_map" value="checked"><label for="check2_single_map">オペレータが周りの安全を確認していること</label></div>
            <div><input type="checkbox" id="check3_single_map" name="check3_single_map" value="checked"><label for="check3_single_map">フリースイッチをオフしていること</label></div>
        </div>
        
        <div class="input-field">
            <label for="arguments">スクリプト引数:</label>
            <input type="text" id="arguments" name="arguments" placeholder="例: arg1 arg2">
        </div>
        <input type="hidden" name="command" value="execute_single_map_run">
        <div style="text-align: center; margin-top: 20px;">
            <button type="submit" id="executeBtn_single_map" class="special inactive-button" disabled style="font-size: 200%;">自律走行開始</button>
        </div>
    </form>
</div>
<style>
    .single_map-run-popup-content {
        text-align: center;
        padding: 20px;
    }
    .single_map-run-popup-content div {
        margin-bottom: 30px;
        text-align: left;
    }
    .single_map-run-popup-content label {
        margin-left: 5px;
    }
    .input-field {
        margin-top: 20px; /* ✅ 新しい入力フィールドの間隔 */
        text-align: center;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const checkboxes = document.querySelectorAll('#checklist-container input[type="checkbox"]');
        const executeBtn = document.getElementById('executeBtn_single_map');
        const single_mapRunForm = document.getElementById('single_mapRunForm');

        function checkFormValidity() {
            const allChecked = Array.from(checkboxes).every(checkbox => checkbox.checked);
            if (allChecked) {
                executeBtn.disabled = false;
                executeBtn.classList.remove('inactive-button');
            } else {
                executeBtn.disabled = true;
                executeBtn.classList.add('inactive-button');
            }
        }

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', checkFormValidity);
        });

        // ページ読み込み時に初期状態を確認
        checkFormValidity();
    });
</script>
