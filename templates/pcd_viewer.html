<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PCD 3Dビューア</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        #viewer-container { width: 100vw; height: 100vh; }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 1.2em;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 3px;
        }
        /* 既存：カメラ操作ボタン (右下) */
        #rotation-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            /* リセットボタンのスペースを含めグリッドを定義 */
            display: grid; 
            grid-template-columns: repeat(2, 70px);
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        /* モデル回転コントロールのCSS (左下に配置) */
        #model-rotation-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid; 
            grid-template-columns: repeat(2, 70px);
            gap: 10px;
            padding: 15px;
            background: rgba(240, 248, 255, 0.85);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .rotation-button, .model-rotation-button {
            width: 70px;
            height: 70px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            user-select: none;
            line-height: 1; 
        }
        .rotation-button:active, .model-rotation-button:active {
            background: #eee;
        }
        .model-rotation-button {
             background: #f0f0f0;
             border: 1px solid #aaa;
        }
        
        /* リセットボタン固有のスタイル */
        #reset-camera-button {
            grid-column: 1 / 3; /* 2列全体を使用 */
            background: #ff5757;
            color: white;
            height: 40px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        #reset-camera-button:active {
            background: #e04a4a;
        }
        
        .axis-label {
            font-size: 12px;
            margin-top: 5px;
            font-weight: bold;
        }
        .axis-z { color: blue; }
        .axis-y { color: green; }
        .axis-x { color: red; }
    </style>
    
    <script type="module">
        import * as THREE from '{{ url_for("static", filename="js/three/three.module.js") }}'; 
        import { PCDLoader } from '{{ url_for("static", filename="js/three/PCDLoader.js") }}';
        import { OrbitControls } from '{{ url_for("static", filename="js/three/OrbitControls.js") }}'; 

        
        const mapName = '{{ map_name | default("") }}';
        const filename = mapName ? mapName + '.pcd' : '';
        const pcdUrl = filename ? '/map/' + filename : '';
        
        let scene, camera, renderer, loader;
        let controls; 
        let pointsMesh = null;
        let axesHelper = null; 

        // カメラの初期設定を保存するグローバル変数
        const initialCamera = {
            position: new THREE.Vector3(),
            target: new THREE.Vector3()
        };

        /**
         * カメラのアップベクトルをワールドのY軸にリセットする (camera.up.set(0, 1, 0) の代替)
         */
        function resetCameraUpVector() {
            if (!camera) return;
            camera.up.x = 0;
            camera.up.y = 1;
            camera.up.z = 0;
        }
        
        /**
         * ターゲットを中心にカメラを回転させる関数 (ヨー/ピッチ/ロール)
         * @param {string} axis - 'x', 'y', または 'z'
         * @param {number} sign - 1 (正方向) または -1 (負方向)
         */
        function rotateCamera(axis, sign) {
            if (!controls) return;
            
            const angle = sign * (Math.PI / 18); // 10度回転
            const target = controls.target;
            const position = camera.position;
            
            let rotationAxis = new THREE.Vector3();

            // 回転軸を決定 (Y-up座標系)
            if (axis === 'y') {
                // Y軸回転 (ヨー: 地面に対して垂直)
                rotationAxis.set(0, 1, 0);
            } else if (axis === 'x') {
                // X軸回転 (ピッチ: 水平軸周りの上下回転)
                const tempY = new THREE.Vector3();
                const tempZ = new THREE.Vector3();
                camera.matrixWorld.extractBasis(rotationAxis, tempY, tempZ);
                rotationAxis.normalize(); 
            } else if (axis === 'z') {
                // Z軸回転 (ロール: 視線軸周りの回転)
                camera.getWorldDirection(rotationAxis).negate(); 
            } else {
                return;
            }

            const quaternion = new THREE.Quaternion().setFromAxisAngle(rotationAxis, angle);
            
            // ターゲットを中心にカメラの位置を回転
            const offset = position.clone().sub(target);
            offset.applyQuaternion(quaternion);
            camera.position.copy(target).add(offset);
            
            // ロール回転の場合、カメラのアップベクトルも回転させる
            if (axis === 'z') {
                camera.up.applyQuaternion(quaternion);
            }
            
            camera.lookAt(target);
            controls.update();
        }
        
        /**
         * 点群モデルをワールド座標軸を中心に回転させる関数
         * @param {string} axis - 'x', 'y', または 'z'
         * @param {number} sign - 1 (正方向) または -1 (負方向)
         */
        function rotateModel(axis, sign) {
            if (!pointsMesh) return;
            
            const angle = sign * (Math.PI / 18); // 10度回転
            let rotationAxis = new THREE.Vector3();

            // ワールド座標軸を設定
            if (axis === 'x') {
                rotationAxis.set(1, 0, 0);
            } else if (axis === 'y') {
                rotationAxis.set(0, 1, 0);
            } else if (axis === 'z') {
                rotationAxis.set(0, 0, 1);
            } else {
                return;
            }

            // モデルの回転
            pointsMesh.rotateOnWorldAxis(rotationAxis, angle);
            
            controls.update(); 
        }

        /**
         * カメラの位置を初期設定にリセットする関数
         */
        function resetCamera() {
            if (!controls || !initialCamera.position.lengthSq()) return;

            // カメラの位置とターゲットを初期値に戻す
            camera.position.copy(initialCamera.position);
            controls.target.copy(initialCamera.target);
            
            // カメラのアップベクトルをリセットする関数を呼び出し
            resetCameraUpVector();
            
            // コントロールを更新
            controls.update();
            camera.lookAt(controls.target);
        }

        function init() {
            if (!pcdUrl || mapName === '') { 
                document.getElementById('loading-message').textContent = "エラー: マップ名が指定されていません。";
                return;
            }
            
            const container = document.getElementById('viewer-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // 1. シーン、カメラ、レンダラーの設定
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);
            
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(5, 5, 5); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            // 軸ヘルパー（ギズモ）の初期化 (長さ1)
            axesHelper = new THREE.AxesHelper(1); 
            axesHelper.isAxesHelper = true; 

            // 2. PCDLoaderの設定
            loader = new PCDLoader();
            
            // 3. コントロール (マウス操作)
            controls = new OrbitControls(camera, renderer.domElement); 
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            
            // パン操作をワールド座標系（XY平面）に限定
            controls.screenSpacePanning = false; 
            
            controls.minDistance = 1;
            controls.maxDistance = 500;
            
            // マウスボタンの設定
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,    
                MIDDLE: THREE.MOUSE.DOLLY,   
                RIGHT: THREE.MOUSE.PAN       
            };

            // 4. PCDファイルの読み込み
            document.getElementById('loading-message').textContent = `PCDファイル "${filename}" を読み込み中...`;

            loader.load(
                pcdUrl,
                // 読み込み成功時のコールバック
                function (points) {
                    pointsMesh = points; 
                    scene.add(pointsMesh);
                    
                    // AxesHelperを点群オブジェクトの子として追加
                    pointsMesh.add(axesHelper);

                    document.getElementById('loading-message').style.display = 'none';
                    document.getElementById('info').innerHTML = `マップ: <b>${filename}</b><br>点群数: ${points.geometry.attributes.position.count}`;

                    // カメラを点群の中心に合わせる
                    const boundingBox = new THREE.Box3().setFromObject(points);
                    const center = new THREE.Vector3();
                    boundingBox.getCenter(center);
                    
                    // 点群モデルをシーンの中心に移動 (AxesHelperも一緒に移動)
                    pointsMesh.position.sub(center); 

                    // OrbitControlsのtargetを点群の中心のワールド座標に設定
                    controls.target.set(0, 0, 0); // 点群モデルがシーンの中心にあるため

                    const size = new THREE.Vector3();
                    boundingBox.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    // カメラの位置を再設定（シーンの原点から対角線上に離れた位置）
                    const cameraDistance = maxDim * 1.5;
                    const initialPos = new THREE.Vector3(cameraDistance, cameraDistance, cameraDistance);
                    camera.position.copy(initialPos);
                    
                    // 初期カメラ設定をグローバル変数に保存
                    initialCamera.position.copy(initialPos);
                    initialCamera.target.copy(controls.target);

                    // 軸ヘルパーのサイズと位置を調整
                    if (axesHelper) {
                        const helperSize = maxDim * 0.1;
                        axesHelper.scale.set(helperSize, helperSize, helperSize);
                        // 親である点群の中心に相対的に配置
                        axesHelper.position.set(0, 0, 0); 
                    }
                    
                    controls.update();
                    animate();
                },
                // 読み込み進捗時のコールバック
                function (xhr) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading-message').textContent = `PCDファイル "${filename}" を読み込み中... ${percent}%`;
                },
                // 読み込みエラー時のコールバック
                function (error) {
                    console.error('PCDファイルの読み込み中にエラーが発生しました:', error);
                    document.getElementById('loading-message').textContent = `エラー: PCDファイル "${filename}" の読み込みに失敗しました。`;
                    if (error.target && error.target.status === 404) {
                         document.getElementById('loading-message').textContent += ' (404 Not Found: ファイルパスを確認してください)';
                    }
                }
            );

            // 5. リサイズハンドラ
            window.addEventListener('resize', onWindowResize, false);
            
            // カメラ回転ボタンイベントリスナー
            document.getElementById('rotate-y-left').addEventListener('click', () => rotateCamera('y', 1));
            document.getElementById('rotate-y-right').addEventListener('click', () => rotateCamera('y', -1));
            document.getElementById('rotate-x-up').addEventListener('click', () => rotateCamera('x', 1));
            document.getElementById('rotate-x-down').addEventListener('click', () => rotateCamera('x', -1));
            document.getElementById('rotate-z-left').addEventListener('click', () => rotateCamera('z', 1));
            document.getElementById('rotate-z-right').addEventListener('click', () => rotateCamera('z', -1));
            
            // モデル回転ボタンイベントリスナー
            document.getElementById('model-rotate-x-up').addEventListener('click', () => rotateModel('x', 1));
            document.getElementById('model-rotate-x-down').addEventListener('click', () => rotateModel('x', -1));
            document.getElementById('model-rotate-y-left').addEventListener('click', () => rotateModel('y', 1));
            document.getElementById('model-rotate-y-right').addEventListener('click', () => rotateModel('y', -1));
            document.getElementById('model-rotate-z-left').addEventListener('click', () => rotateModel('z', 1));
            document.getElementById('model-rotate-z-right').addEventListener('click', () => rotateModel('z', -1));

            // カメラリセットボタンイベントリスナー
            document.getElementById('reset-camera-button').addEventListener('click', resetCamera);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // init() の呼び出し
        if (mapName !== '') {
            init();
        } else {
            document.getElementById('loading-message').textContent = "エラー: マップ名が指定されていません。";
        }

    </script>
</head>
<body>
    <div id="viewer-container"></div>
    <div id="loading-message">ビューアを初期化中...</div>
    <div id="info">マップ名: -</div>

    <div id="model-rotation-controls">
        <div style="grid-column: 1 / 3; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 5px;">
            モデル回転 (World Axis)
        </div>
        
        <div id="model-rotate-y-left" class="model-rotation-button">
            ↺
            <span class="axis-label axis-y">Y</span>
        </div>
        <div id="model-rotate-y-right" class="model-rotation-button">
            ↻
            <span class="axis-label axis-y">Y</span>
        </div>
        
        <div id="model-rotate-x-up" class="model-rotation-button">
            ↑
            <span class="axis-label axis-x">X</span>
        </div>
        <div id="model-rotate-x-down" class="model-rotation-button">
            ↓
            <span class="axis-label axis-x">X</span>
        </div>

        <div id="model-rotate-z-left" class="model-rotation-button">
            ⟲
            <span class="axis-label axis-z">Z</span>
        </div>
        <div id="model-rotate-z-right" class="model-rotation-button">
            ⟳
            <span class="axis-label axis-z">Z</span>
        </div>
    </div>

    <div id="rotation-controls">
        <div style="grid-column: 1 / 3; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 5px;">
            カメラ操作 (Target Orbit)
        </div>
        
        <div id="rotate-z-left" class="rotation-button">
            ⟲
            <span class="axis-label axis-z">Z (ロール)</span>
        </div>
        <div id="rotate-z-right" class="rotation-button">
            ⟳
            <span class="axis-label axis-z">Z (ロール)</span>
        </div>
        
        <div id="rotate-y-left" class="rotation-button">
            ↺
            <span class="axis-label axis-y">Y (ヨー)</span>
        </div>
        <div id="rotate-y-right" class="rotation-button">
            ↻
            <span class="axis-label axis-y">Y (ヨー)</span>
        </div>
        
        <div id="rotate-x-up" class="rotation-button">
            ↑
            <span class="axis-label axis-x">X (ピッチ)</span>
        </div>
        <div id="rotate-x-down" class="rotation-button">
            ↓
            <span class="axis-label axis-x">X (ピッチ)</span>
        </div>
        
        <button id="reset-camera-button" class="rotation-button">カメラリセット</button>
    </div>
</body>
</html>
