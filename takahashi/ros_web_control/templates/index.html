<!DOCTYPE html>
<html>
<head>
    <title>ROS Control via ngrok</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/ros_control.js') }}"></script>
</head>
<body>
    <h1>ROS Control via ngrok</h1>
    <p id="connection_status">Connecting to ROS...</p>

    <div>
        <h2>Publish Message to /hello</h2>
        <input type="text" id="message_input" value="Hello from web client!">
        <button onclick="publishHello()">Publish</button>
    </div>

    <div>
        <h2>Subscribe to /hello</h2>
        <p id="received_message">No message received yet.</p>
    </div>

    <script type="text/javascript">
        var ros = null;
        var hello_topic = null;

            document.addEventListener('DOMContentLoaded', function() {
            // ngrok で公開された WebSocket URL をここに設定 (起動後に確認)
                connectToROS('wss://takahashi-thinkpad-x13-gen-2.tailfa031c.ts.net/ws');
            });

        function connectToROS(websocket_url) {
            ros = new ROSLIB.Ros({
                url: websocket_url
            });

            ros.on('connection', function() {
                console.log('Connected to ROSBridge WebSocket server.');
                document.getElementById('connection_status').textContent = 'Connected to ROS.';
                setupTopics();
            });

            ros.on('error', function(error) {
                console.error('Error connecting to ROSBridge WebSocket server: ', error);
                document.getElementById('connection_status').textContent = 'Error connecting to ROS.';
            });

            ros.on('close', function() {
                console.log('Connection to ROSBridge WebSocket server closed.');
                document.getElementById('connection_status').textContent = 'Connection closed.';
            });
        }

        function setupTopics() {
            hello_topic = new ROSLIB.Topic({
                ros: ros,
                name: '/hello',
                messageType: 'std_msgs/String'
            });

            // Subscribe to /hello
            var listener = new ROSLIB.Topic({
                ros: ros,
                name: '/hello',
                messageType: 'std_msgs/String'
            });

            listener.subscribe(function(message) {
                console.log('Received message on /hello: ' + message.data);
                document.getElementById('received_message').textContent = 'Received: ' + message.data;
            });
        }

        function publishHello() {
            if (ros && hello_topic) {
                var message = new ROSLIB.Message({
                    data: document.getElementById('message_input').value
                });
                hello_topic.publish(message);
                console.log('Published message to /hello');
            } else {
                console.error('Not connected to ROS or topic not initialized.');
            }
        }
    </script>
</body>
</html>
