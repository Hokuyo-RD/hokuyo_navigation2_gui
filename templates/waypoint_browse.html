<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウェイポイントファイル選択 - PCD2PGM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="{{ url_for('static', filename='js/jquery/jquery-3.6.0.min.js') }}"></script>

    <script>
        // pcd_pgm_convert.htmlから流用
        function closeCurrentTabAndReloadOpener() {
            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.location.reload();
                }
            } catch (e) {
                console.warn("親ウィンドウのリロードに失敗しました:", e);
            }
            window.close();
        }

        $(document).ready(function() {
            var selectedWaypoint = ''; // 選択されたウェイポイントファイル名 (ファイル名のみ)

            // 1. ファイルリストのクリックイベント
            $('.file-list li').click(function() {
                $('.file-list li').removeClass('selected');
                $(this).addClass('selected');
                selectedWaypoint = $(this).data('filename'); // data-filename属性からファイル名を取得
                $('#continue_button').prop('disabled', false); // ファイルが選択されたら有効化
                console.log("選択されたウェイポイント: " + selectedWaypoint);
            });

            // 2. 「キャンセル」ボタンの動作
            $('#cancel_button').click(function() {
                // ウェイポイントの選択をキャンセルし、親ウィンドウに戻る
                closeCurrentTabAndReloadOpener();
            });

            // 3. 「スキップ（なしで続行）」ボタンの動作
            $('#skip_button').click(function() {
                // ウェイポイントファイル名を空文字列として次へ進む
                redirectToPgmConvert('');
            });

            // 4. 「選択して続行」ボタンの動作
            $('#continue_button').click(function() {
                if (selectedWaypoint) {
                    redirectToPgmConvert(selectedWaypoint);
                } else {
                    alert('ウェイポイントファイルを選択するか、「スキップ」をクリックしてください。');
                }
            });

            // 5. 次の画面へ遷移する関数
            function redirectToPgmConvert(waypoint_filename) {
                var pcd_filename = '{{ input_pcd_filename }}'; // サーバーから渡されたPCDファイル名

                // 次の画面（pcd_pgm_convert.html）へリダイレクト
                // PCDファイル名と選択したウェイポイントファイル名をクエリパラメータで渡す
                var redirectUrl = '{{ url_for('pcd_pgm_convert_page') }}' +
                                  '?input_pcd_filename=' + encodeURIComponent(pcd_filename) +
                                  '&input_waypoint_filename=' + encodeURIComponent(waypoint_filename);

                window.location.href = redirectUrl;
            }

            // 初期状態で続行ボタンを無効化
            $('#continue_button').prop('disabled', true);

            // ウェイポイントファイルがない場合のメッセージ
            if ($('.file-list li').length === 0) {
                 $('#status_message')
                     .addClass('alert alert--warning')
                     .html('<p>⚠️ ウェイポイントファイルが見つかりません。スキップボタンでPCD変換へ進んでください。</p>')
                     .show();
            } else {
                 $('#status_message').hide();
            }
        });
    </script>
</head>
<body class="page">
    <div class="container">
        <h2>PCD to PGM 変換: ウェイポイント選択</h2>

        <div class="alert alert--warning">
            PCDファイル: <strong>{{ input_pcd_filename }}</strong>
            <p>マップのPGM化と同時にウェイポイント情報（JSON）をYAMLに含めるか選択してください。</p>
        </div>

        <h3>利用可能なウェイポイントファイル (.json)</h3>

        <ul class="file-list file-list--selectable">
            {% for filename in waypoint_files %}
                <li data-filename="{{ filename }}">{{ filename }}</li>
            {% else %}
                <li class="is-empty">利用可能な .json ウェイポイントファイルはありません。</li>
            {% endfor %}
        </ul>

        <div id="status_message"></div>

        <div class="actions">
            <button id="continue_button" class="btn btn--success">選択して続行</button>
            <button id="skip_button" class="btn btn--secondary">スキップ（なしで続行）</button>
            <button id="cancel_button" class="btn btn--secondary">キャンセル</button>
        </div>
    </div>
</body>
</html>
