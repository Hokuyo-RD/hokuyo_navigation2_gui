<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PCD 3Dビューア</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        #viewer-container { width: 100vw; height: 100vh; }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 1.2em;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 3px;
        }
    </style>
    
    <script type="module">
        // 🌟 修正: FlaskのSTATICルートを使用してローカルファイルを読み込む 🌟
        
        // 開発者ツールで強制的に実行を停止させるデバッグコマンド (確認後、削除推奨)
        // debugger; 

        // 1. Three.js本体のインポート (例: static/js/three/three.module.js)
        import * as THREE from '{{ url_for("static", filename="js/three/three.module.js") }}'; 
        
        // 2. ローダーとコントロールのインポート (例: static/js/three/PCDLoader.js)
        import { PCDLoader } from '{{ url_for("static", filename="js/three/PCDLoader.js") }}';
        import { OrbitControls } from '{{ url_for("static", filename="js/three/OrbitControls.js") }}';

        
        // Jinja2テンプレートからマップ名を取得 (シングルクォート修正済み)
        const mapName = '{{ map_name | default("") }}';
        const filename = mapName ? mapName + '.pcd' : '';
        const pcdUrl = filename ? '/map/' + filename : ''; // PCDファイルへのWebアクセスルート
        
        let scene, camera, renderer, loader;
        let controls; 

        function init() {
            // mapNameが空文字の場合のチェック
            if (!pcdUrl || mapName === '') { 
                document.getElementById('loading-message').textContent = "エラー: マップ名が指定されていません。";
                return;
            }
            
            const container = document.getElementById('viewer-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // 1. シーン、カメラ、レンダラーの設定
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);
            
            camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            camera.position.set(5, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            // 2. PCDLoaderの設定
            loader = new PCDLoader();
            
            // 3. コントロール (マウス操作)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 1;
            controls.maxDistance = 500;
            
            // 4. PCDファイルの読み込み
            document.getElementById('loading-message').textContent = `PCDファイル "${filename}" を読み込み中...`;

            loader.load(
                pcdUrl,
                // 読み込み成功時のコールバック
                function (points) {
                    scene.add(points);
                    
                    document.getElementById('loading-message').style.display = 'none';
                    document.getElementById('info').innerHTML = `マップ: <b>${filename}</b><br>点群数: ${points.geometry.attributes.position.count}`;

                    // カメラを点群の中心に合わせる
                    const boundingBox = new THREE.Box3().setFromObject(points);
                    const center = new THREE.Vector3();
                    boundingBox.getCenter(center);
                    controls.target.copy(center);
                    
                    const size = new THREE.Vector3();
                    boundingBox.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    camera.position.copy(center).add(new THREE.Vector3(maxDim, maxDim, maxDim).multiplyScalar(0.5));
                    
                    controls.update();
                    animate();
                },
                // 読み込み進捗時のコールバック
                function (xhr) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading-message').textContent = `PCDファイル "${filename}" を読み込み中... ${percent}%`;
                },
                // 読み込みエラー時のコールバック
                function (error) {
                    console.error('PCDファイルの読み込み中にエラーが発生しました:', error);
                    document.getElementById('loading-message').textContent = `エラー: PCDファイル "${filename}" の読み込みに失敗しました。`;
                    // 404エラーの場合はサーバーパスが間違っている可能性
                    if (error.target && error.target.status === 404) {
                         document.getElementById('loading-message').textContent += ' (404 Not Found: ファイルパスを確認してください)';
                    }
                }
            );

            // 5. リサイズハンドラ
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // init() の呼び出し
        if (mapName !== '') {
            init();
        } else {
            document.getElementById('loading-message').textContent = "エラー: マップ名が指定されていません。";
        }

    </script>
</head>
<body>
    <div id="viewer-container"></div>
    <div id="loading-message">ビューアを初期化中...</div>
    <div id="info">マップ名: -</div>
</body>
</html>
