<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSV編集: {{ filename }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/editor.css') }}">
    <script src="{{ url_for('static', filename='js/sortable.min.js') }}"></script>
</head>
<body class="page">
    <div class="container container--wide">
        <h1>CSV編集: {{ filename }}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert--{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form id="csvEditorForm" action="{{ url_for('save_structured_csv') }}" method="post">
            <input type="hidden" name="filename" value="{{ filename }}">
            <input type="hidden" name="rows_data" id="rows_data">

            <table id="csvTable" class="table">
                <thead>
                    <tr>
                        <th class="drag-handle-col"></th>
                        <th>Map File</th>
                        <th>Waypoint File</th>
                        <th>Nav Type</th>
                        <th class="col-interval">Interval (sec)</th>
                        <th>削除</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in csv_data %}
                    <tr>
                        <td class="drag-handle drag-handle-col">☰</td>
                        <td>
                            <select class="map-file-select">
                                <option value="">-- 選択 --</option>
                                {% for map_file in available_map_files %}
                                <option value="{{ map_file }}" {% if row.map_file == map_file %}selected{% endif %}>{{ map_file }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <select class="waypoint-file-select">
                                <option value="">-- 選択 --</option>
                                {% for wp_file in available_wp_files %}
                                <option value="{{ wp_file }}" {% if row.waypoint_file == wp_file %}selected{% endif %}>{{ wp_file }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <select class="nav-type-select">
                                <option value="">-- 選択 --</option>
                                <option value="gnss" {% if row.nav_type == 'gnss' %}selected{% endif %}>gnss</option>
                                <option value="loc" {% if row.nav_type == 'loc' %}selected{% endif %}>loc</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" class="interval-input" value="{{ row.get('interval', '15') }}" placeholder="e.g., 15">
                        </td>
                        <td><button type="button" class="btn btn--danger btn--sm">削除</button></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <div class="actions actions--end">
                <button type="button" id="addRowBtn" class="btn btn--primary">行を追加</button>
                <button type="submit" class="btn btn--success">保存</button>
                <button type="button" class="btn btn--secondary" onclick="window.location.href='{{ url_for('browse_files', dir_type='config') }}'">キャンセル</button>
            </div>
        </form>
    </div>

    <script>
        // Pass available files from Jinja2 to JavaScript
        const jsAvailableMapFiles = {{ available_map_files | tojson }};
        const jsAvailableWpFiles = {{ available_wp_files | tojson }};

        document.addEventListener('DOMContentLoaded', function() {
            const csvTableBody = document.querySelector('#csvTable tbody');
            const addRowBtn = document.getElementById('addRowBtn');
            const csvEditorForm = document.getElementById('csvEditorForm');
            const rowsDataInput = document.getElementById('rows_data');

            // Initialize SortableJS for drag-and-drop reordering
            new Sortable(csvTableBody, {
                animation: 150, // ms, animation speed moving items when sorting, `0` for no animation.
                ghostClass: 'sortable-ghost', // Class name for the drop placeholder
                handle: '.drag-handle', // Draggable handle is now the specific element with this class
            });

            function createRow(data = { map_file: '', waypoint_file: '', nav_type: '' }) {
                const row = document.createElement('tr');

                // Create Drag Handle
                const dragTd = document.createElement('td');
                dragTd.className = 'drag-handle drag-handle-col';
                dragTd.innerHTML = '☰';

                // Create Map File Select
                const mapSelect = document.createElement('select');
                mapSelect.className = 'map-file-select';
                let mapOptionsHtml = '<option value="">-- 選択 --</option>';
                jsAvailableMapFiles.forEach(mapFile => {
                    mapOptionsHtml += `<option value="${mapFile}" ${data.map_file === mapFile ? 'selected' : ''}>${mapFile}</option>`;
                });
                mapSelect.innerHTML = mapOptionsHtml;

                // Create Waypoint File Select
                const wpSelect = document.createElement('select');
                wpSelect.className = 'waypoint-file-select';
                let wpOptionsHtml = '<option value="">-- 選択 --</option>';
                jsAvailableWpFiles.forEach(wpFile => {
                    wpOptionsHtml += `<option value="${wpFile}" ${data.waypoint_file === wpFile ? 'selected' : ''}>${wpFile}</option>`;
                });
                wpSelect.innerHTML = wpOptionsHtml;

                // Create Nav Type Select
                const navSelect = document.createElement('select');
                navSelect.className = 'nav-type-select';
                navSelect.innerHTML = `
                    <option value="">-- 選択 --</option>
                    <option value="gnss" ${data.nav_type === "gnss" ? 'selected' : ''}>gnss</option>
                    <option value="loc" ${data.nav_type === "loc" ? 'selected' : ''}>loc</option>
                `;

                // Create Interval Input
                const intervalInput = document.createElement('input');
                intervalInput.type = 'text';
                intervalInput.className = 'interval-input';
                intervalInput.value = data.interval || '1'; // Default value

                const mapTd = document.createElement('td');
                mapTd.appendChild(mapSelect);
                const wpTd = document.createElement('td');
                wpTd.appendChild(wpSelect);
                const navTd = document.createElement('td');
                navTd.appendChild(navSelect);

                const intervalTd = document.createElement('td');
                intervalTd.appendChild(intervalInput);

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'btn btn--danger btn--sm';
                deleteButton.textContent = '削除';
                deleteButton.addEventListener('click', function() {
                    row.remove();
                });
                const actionTd = document.createElement('td');
                actionTd.appendChild(deleteButton);

                row.appendChild(dragTd);
                row.appendChild(mapTd);
                row.appendChild(wpTd);
                row.appendChild(navTd);
                row.appendChild(intervalTd);
                row.appendChild(actionTd);

                return row;
            }

            addRowBtn.addEventListener('click', function() {
                csvTableBody.appendChild(createRow());
            });

            // Initial setup for existing delete buttons
            csvTableBody.querySelectorAll('.btn--danger').forEach(button => {
                button.addEventListener('click', function() {
                    button.closest('tr').remove();
                });
            });

            csvEditorForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent default form submission

                const rows = [];
                csvTableBody.querySelectorAll('tr').forEach(row => {
                    const mapFile = row.querySelector('.map-file-select').value;
                    const waypointFile = row.querySelector('.waypoint-file-select').value;
                    const navType = row.querySelector('.nav-type-select').value;
                    const interval = row.querySelector('.interval-input').value;
                    rows.push({ map_file: mapFile, waypoint_file: waypointFile, nav_type: navType, interval: interval });
                });

                rowsDataInput.value = JSON.stringify(rows);
                csvEditorForm.submit(); // Submit the form with JSON data
            });
        });
    </script>
</body>
</html>
