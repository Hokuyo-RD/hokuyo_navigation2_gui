            margin-bottom: 15px;

    <script type="module">
        import * as THREE from 'three';
        import { PCDLoader } from 'three/addons/loaders/PCDLoader.js'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 
        let waypoints = []; 
        let mapData = null; 
        const meshRegistry = {}; 
        let currentMapName = '{{ map_name }}'; // Flaskから渡された値を初期値として設定
        let scene, camera, renderer, loader;
        let controls;

        function quaternionToYaw(qx, qy, qz, qw) {
            const siny_cosp = 2 * (qw * qz + qx * qy);
            const cosy_cosp = 1 - 2 * (qy * qy + qz * qz);
            return Math.atan2(siny_cosp, cosy_cosp);
        }

        async function parsePGM(urlOrBuffer, mapData) {
            let buffer;
            if (typeof urlOrBuffer === 'string') {
                const response = await fetch(urlOrBuffer);
                if (!response.ok) {
                    throw new Error(`Failed to fetch PGM file: ${response.statusText}`);
                }
                buffer = await response.arrayBuffer();
            } else {
                buffer = urlOrBuffer;
            }

            const decoder = new TextDecoder('ascii');
            let offset = 0;
            
            // 1. マジックナンバー (P5)
            let magicNumber = decoder.decode(new Uint8Array(buffer, offset, 2));
            if (magicNumber !== 'P5') {
                throw new Error(`Unsupported PGM format: ${magicNumber}. Only P5 (binary) is supported.`);
            }
            offset += 2;
            
            // 2. 幅、高さ、最大値を取得するためのヘッダー解析
            let headerText = '';
            let headerEndIndex = -1;
            
            // ヘッダーを解析してデータ開始位置を見つける
            for (let i = offset; i < buffer.byteLength; i++) {
                const charCode = new Uint8Array(buffer, i, 1)[0];
                const char = String.fromCharCode(charCode);

                if (char === '\n') {
                    // ヘッダー行を処理
                    const lines = headerText.split('\n').map(line => line.trim()).filter(line => line !== '');
                    
                    // コメント行 (#) 以外の行を抽出
                    const dataLines = lines.filter(line => !line.startsWith('#'));
                    
                    if (dataLines.length >= 2) {
                        headerEndIndex = i + 1; // ピクセルデータの開始位置
                        break;
                    }
                }
                headerText += char;
            }
            
            if (headerEndIndex === -1) {
                throw new Error("PGM header analysis failed.");
            }
            
            // 幅、高さ、最大値の抽出
            const lines = headerText.split('\n').filter(line => !line.startsWith('#') && line.trim() !== '');
            const dimensions = lines[0].trim().split(/\s+/).map(Number);
            const width = dimensions[0];
            const height = dimensions[1];
            const maxValue = Number(lines[1].trim()); // 通常は255
            
            if (!width || !height || !maxValue) {
                 throw new Error("PGM header data (width, height, max value) is invalid.");
            }
            
            // 3. ピクセルデータ
            const pixelDataStart = headerEndIndex;
            const pixelDataSize = width * height;
            const grayData = new Uint8Array(buffer, pixelDataStart, pixelDataSize);

            // 4. Three.jsテクスチャ用のRGBAデータに変換と色付け (視認性改善ロジック)
            const data = new Uint8Array(pixelDataSize * 4);
            
            const occupiedThresh = mapData.occupied_thresh || 0.65;
            const freeThresh = mapData.free_thresh || 0.196;
            
            // しきい値を 0-255 のグレースケール値に変換
            // Note: 実際には、ROSのmap_serverは 0, 205, 254 の3値を使用することが多いです
            
            for (let i = 0; i < pixelDataSize; i++) {
                const gray = grayData[i];
                const offset = i * 4;

                if (gray === 0) {
                    // 占有セル (黒): 赤色で強調し、半不透明
                    data[offset] = 255;     // R
                    data[offset + 1] = 50;  // G
                    data[offset + 2] = 50;  // B
                    data[offset + 3] = 200; // A: 80% 不透明
                } else if (gray === 254) {
                    // 自由セル (白): 薄い緑色で、半透明
                    data[offset] = 150;     // R
                    data[offset + 1] = 255; // G
                    data[offset + 2] = 150; // B
                    data[offset + 3] = 100; // A: 40% 不透明
                } else if (gray === 205) {
                    // 未知の領域 (灰色): 完全に透明
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0; // A: 完全に透明
                } else {
                    // その他の値（通常は発生しない）
                    data[offset] = 0;
                    data[offset + 1] = 0;
                    data[offset + 2] = 0;
                    data[offset + 3] = 0;
                }
            }

            return { data, width, height, maxValue };
        }
        
        function createToggle(id, labelText, mesh) {
            const container = document.getElementById('dynamic-toggles');
            
            // 既存のトグルがあれば削除（上書きロード時のため）
            const existingLabel = document.getElementById(id + '-label');
            if (existingLabel) {
                existingLabel.remove();
            }

            const label = document.createElement('label');
            label.setAttribute('for', id);
            label.id = id + '-label';
            label.style.display = 'flex';
            label.style.gap = '5px';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = id;
            checkbox.checked = true; // 初期状態は表示
            
            checkbox.addEventListener('change', () => {
                if (mesh) {
                    mesh.visible = checkbox.checked;
                }
            });

            const span = document.createElement('span');
            span.textContent = labelText;
            
            label.appendChild(checkbox);
            label.appendChild(span);
            container.appendChild(label);

            return label; 
        }

        async function loadPGMMap(mapName) { 
            const componentType = 'pgm';
            const uniqueId = `${componentType}-${mapName}`;
            
            unloadMap(componentType, mapName); 

            if (!mapData || !mapData.image) {
                console.warn("YAMLデータが存在しないか、'image'キーがありません。PGMロードをスキップします。");
                return;
            }
            
            const pgmUrl = '/map/' + mapData.image; // サーバーのURLを構築
            const PGM_Z_OFFSET = 0.0; 
            const origin = mapData.origin; 
            const resolution = mapData.resolution; 
            const pgmImageName = mapData.image; 
            
            try {
                const pgmResult = await parsePGM(pgmUrl, mapData); 
                
                const imgWidth = pgmResult.width;
                const imgHeight = pgmResult.height;
                const mapWidth = imgWidth * resolution;
                const mapHeight = imgHeight * resolution;
                
                const texture = new THREE.DataTexture(
                    pgmResult.data, 
                    imgWidth, 
                    imgHeight, 
                    THREE.RGBAFormat 
                );
                
                texture.flipY = false; 
                texture.wrapS = THREE.ClampToEdgeWrapping; 
                texture.repeat.set(-1, 1);                  
                texture.offset.set(1, 0);                   
                texture.needsUpdate = true;
                
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    side: THREE.FrontSide, 
                    transparent: true,
                    opacity: 1.0, 
                });

                const geometry = new THREE.PlaneGeometry(mapWidth, mapHeight);
                
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.rotation.x = 0; 
                mesh.rotation.y = 0; 
                mesh.rotation.z = -Math.PI; 

                const centerX = origin[0] + mapWidth / 2;  
                const centerY = origin[1] + mapHeight / 2; 
                
                mesh.position.set(
                    centerX,                          // X軸中心
                    centerY,                          // Y軸中心
                    PGM_Z_OFFSET                      // Z軸: 0.0
                ); 
                
                scene.add(mesh);
                
                // レジストリに登録
                meshRegistry[uniqueId] = mesh; 
                
                // 動的トグルの追加
                createToggle(uniqueId, `PGM/YAML (${mapName})`, mesh);

                document.getElementById('info').innerHTML += `<br>PGM: ${pgmImageName} 配置完了`;
                console.log(`PGMマップを配置しました: ${mapName}`);

            } catch (error) {
                console.error('PGMファイルのロード/パース中にエラーが発生しました:', pgmUrl, error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">PGMロードエラー: ${error.message}</span>`;
            }
        }
        
        async function loadPCD(mapName) {
            const componentType = 'pcd';
            const uniqueId = `${componentType}-${mapName}`;
            const pcdUrl = `/map/${mapName}.pcd`;
            
            unloadMap(componentType, mapName); 
            document.getElementById('loading-message').textContent = `PCDファイル (${mapName}.pcd) をロード中...`;
            document.getElementById('loading-message').style.display = 'block';

            try {
                const response = await fetch(pcdUrl);
                if (!response.ok) {
                    throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                }
                
                const buffer = await response.arrayBuffer();
                const filename = `${mapName}.pcd`;

                // PCDLoader の parse メソッドを使用して ArrayBuffer から直接ロード
                const points = loader.parse(buffer);

                points.position.set(0, 0, 0); 
                points.visible = true; // 初期状態は表示

                if (points.material.size) {
                    points.material.size = 0.05; 
                }
                
                scene.add(points);
                
                // レジストリに登録
                meshRegistry[uniqueId] = points;

                // カメラ位置調整 (PCDは座標系の中心なので、ここで実行)
                points.geometry.computeBoundingSphere();
                const center = points.geometry.boundingSphere.center;
                camera.position.set(center.x + 5, center.y + 5, center.z + 5);
                controls.target.copy(center); 
                controls.update();

                const pointCount = points.geometry.attributes.position.count;
                document.getElementById('info').innerHTML = `PCD: ${filename} (${pointCount} points)`;
                document.getElementById('loading-message').style.display = 'none';

                // 動的トグルの追加
                createToggle(uniqueId, `PCD (${mapName})`, points);


            } catch (error) {
                console.error('PCDファイルのロード中にエラーが発生しました:', error);
                document.getElementById('loading-message').textContent = `エラー: PCDロード失敗 (${mapName}.pcd): ${error.message}`;
                document.getElementById('info').innerHTML = `PCDロード失敗: ${error.message}`;
            }
        }

        async function loadYAML(mapName) {
            const yamlUrl = `/map/${mapName}.yaml`;
            
            unloadMap('pgm', mapName); 
            
            try {
                // Flaskから渡された mapData (yaml_data) をチェック
                const initialYamlData = "{{ yaml_data|safe }}";
                if (initialYamlData && currentMapName === mapName) {
                    mapData = jsyaml.load(initialYamlData);
                    document.getElementById('info').innerHTML += `<br>YAML: ${mapName}.yaml (初期データ) ロード完了`;
                } else {
                    // ファイルをサーバーから取得
                    const response = await fetch(yamlUrl);
                    if (!response.ok) {
                        throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                    }
                    
                    const yamlText = await response.text();
                    mapData = jsyaml.load(yamlText); 
                    
                    document.getElementById('info').innerHTML += `<br>YAML: ${mapName}.yaml ロード完了`;
                }
                
                await loadPGMMap(mapName);

            } catch (error) {
                console.error('YAMLファイルのロード中にエラーが発生しました:', error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">YAMLロード失敗: ${error.message}</span>`;
            }
        }
        
        async function loadWaypoints(mapName) {
            const componentType = 'waypoints';
            const uniqueId = `${componentType}-${mapName}`;
            const jsonUrl = `/map/${mapName}.json`; 
            
            unloadMap(componentType, mapName); 

            try {
                let rawWaypoints;
                const initialWaypointsData = "{{ waypoints_data|safe }}";

                // Flaskから渡された Waypointデータ (waypoints_data) をチェック
                if (initialWaypointsData !== "[]" && currentMapName === mapName) {
                    rawWaypoints = JSON.parse(initialWaypointsData);
                    document.getElementById('info').innerHTML += `<br>Waypoint: ${mapName}.json (初期データ) ロード完了`;
                } else {
                    // ファイルをサーバーから取得
                    const response = await fetch(jsonUrl);
                    if (!response.ok) {
                        throw new Error(`ファイルが見つかりません。ステータス: ${response.status}`);
                    }
                    rawWaypoints = await response.json(); 
                }

                if (rawWaypoints.length === 0) {
                    throw new Error("ウェイポイントファイルが空です。");
                }

                waypoints = rawWaypoints;
                const newWaypointsGroup = new THREE.Group();
                newWaypointsGroup.name = uniqueId; 
                
                const WAYPOINT_Z_OFFSET = 0.0; 
                
                waypoints.forEach((wp, index) => {
                    if (wp.length < 2) return; 

                    const position = wp[0]; // [x, y, z]
                    const orientation = wp[1]; // [qx, qy, qz, qw]
                    
                    const x = position[0];
                    const y = position[1];
                    const z = WAYPOINT_Z_OFFSET; 

                    const yaw = quaternionToYaw(orientation[0], orientation[1], orientation[2], orientation[3]);
                    
                    const SPHERE_RADIUS = 0.3; 
                    const geometry = new THREE.SphereGeometry(SPHERE_RADIUS, 16, 16); 
                    const material = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
                    const sphere = new THREE.Mesh(geometry, material);
                    
                    sphere.position.set(x, y, z);
                    newWaypointsGroup.add(sphere);

                    const dir = new THREE.Vector3(1, 0, 0); 
                    dir.applyAxisAngle(new THREE.Vector3(0, 0, 1), yaw); 
                    
                    const origin = new THREE.Vector3(x, y, z);
                    const length = 1.0; 
                    const color = 0xffff00; 
                    
                    const arrowHelper = new THREE.ArrowHelper(dir, origin, length, color, 0.2, 0.15);

                    newWaypointsGroup.add(arrowHelper);
                });
                
                newWaypointsGroup.visible = true; 
                scene.add(newWaypointsGroup);
                
                // レジストリに登録
                meshRegistry[uniqueId] = newWaypointsGroup;
                
                // 動的トグルの追加
                createToggle(uniqueId, `Waypoints (${mapName})`, newWaypointsGroup);

                document.getElementById('info').innerHTML += `<br>Waypointを ${waypoints.length} 個配置完了`;

                
            } catch (error) {
                console.error('Waypointファイルのロード中にエラーが発生しました:', error);
                document.getElementById('info').innerHTML += `<br><span style="color: red;">Waypointロード失敗: ${error.message}</span>`;
            }
        }
        window.unloadMap = function(type, mapName) {
            const uniqueId = `${type}-${mapName}`;
            const mesh = meshRegistry[uniqueId];
            let elementExists = false;

            if (mesh) {
                if (mesh.isMesh || mesh.isPoints) {
                    mesh.geometry.dispose();
                    if (mesh.material.map) mesh.material.map.dispose();
                    mesh.material.dispose();
                } else if (mesh.isGroup) {
                    for (let i = mesh.children.length - 1; i >= 0; i--) {
                        const child = mesh.children[i];
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                if (child.material.dispose) child.material.dispose();
                            }
                        }
                        mesh.remove(child);
                    }
                }

                scene.remove(mesh);
                delete meshRegistry[uniqueId];
                elementExists = true;
                const toggleLabel = document.getElementById(uniqueId + '-label');
                if (toggleLabel) {
                    toggleLabel.remove();
                }
                if (type === 'pgm') {
                    mapData = null; 
                }
            }
            
            if (elementExists) {
                return true;
            }
            return false;
        }
        
        async function executeMapLoading(mapName, loadPCDFlag, loadPGMFlag, loadWaypointsFlag) {
            // ロード前に、現在のマップに設定
            currentMapName = mapName; 
            document.getElementById('map-name-input').value = mapName;

            document.getElementById('loading-message').textContent = `マップ '${mapName}' のファイルをロード中...`;
            document.getElementById('loading-message').style.display = 'block';
            document.getElementById('info').innerHTML = `ロード開始: ${mapName}`;
            
            let loadCount = 0;
            // PCDのロード
            if (loadPCDFlag) {
                await loadPCD(mapName);
                loadCount++;
            } 
            // PGM/YAMLのロード
            if (loadPGMFlag) {
                await loadYAML(mapName); 
                loadCount++;
            } 
            // Waypointsのロード
            if (loadWaypointsFlag) {
                await loadWaypoints(mapName);
                loadCount++;
            } 
            
            if (loadCount === 0) {
                document.getElementById('info').innerHTML += `<br><span style="color: yellow;">警告: ロード対象が選択されていません。</span>`;
            }

            document.getElementById('loading-message').style.display = 'none';
        }

        window.startLoadProcess = async function() {
            const loadModal = document.getElementById('load-modal');
            const mapNameInput = document.getElementById('modal-map-name-input');
            const loadMapButton = document.getElementById('confirm-load-button');
            const listContainer = document.getElementById('map-list-container');
            
            // 現在のマップ名があれば入力欄に設定
            mapNameInput.value = currentMapName;

            // プレースホルダーのマップ名（または現在のマップ名）
            const mapNameForDisplay = currentMapName || mapNameInput.placeholder; 
            
            // ロード対象のチェックボックスを動的に設定
            listContainer.innerHTML = `
                <label>
                    <input type="checkbox" id="modal-select-pcd" checked> 
                    PCD (${mapNameForDisplay}.pcd)
                </label>
                <label>
                    <input type="checkbox" id="modal-select-pgm" checked> 
                    PGM/YAML (${mapNameForDisplay}.yaml/.pgm)
                </label>
                <label>
                    <input type="checkbox" id="modal-select-waypoints" checked> 
                    Waypoints (${mapNameForDisplay}.json)
                </label>
            `;
            loadModal.style.display = 'block';
            
            // ロードボタンクリック時の処理
            loadMapButton.onclick = async () => {
                const newMapName = mapNameInput.value.trim();
                if (!newMapName) {
                    alert("マップ名を入力してください。");
                    return;
                }
                
                loadModal.style.display = 'none';
                const loadPCDFlag = document.getElementById('modal-select-pcd')?.checked || false;
                const loadPGMFlag = document.getElementById('modal-select-pgm')?.checked || false;
                const loadWaypointsFlag = document.getElementById('modal-select-waypoints')?.checked || false;
                
                await executeMapLoading(newMapName, loadPCDFlag, loadPGMFlag, loadWaypointsFlag);
                document.getElementById('map-name-input').value = newMapName;
            };
        }

        window.startUnloadProcess = function() {
            const unloadModal = document.getElementById('unload-modal');
            const unloadListContainer = document.getElementById('unload-list-container');
            const confirmUnloadButton = document.getElementById('confirm-unload-button');
            
            unloadListContainer.innerHTML = ''; 
            let hasVisibleElements = false;
            
            for (const uniqueId in meshRegistry) {
                const [type, mapName] = uniqueId.split('-');
                const labelText = `${type.toUpperCase()} (${mapName})`;
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" name="unload_item" value="${uniqueId}" checked> ${labelText}`;
                unloadListContainer.appendChild(label);
                
                hasVisibleElements = true;
            }
            
            if (!hasVisibleElements) {
                unloadListContainer.innerHTML = '<p style="color: yellow;">現在表示中の要素はありません。</p>';
                confirmUnloadButton.disabled = true;
            } else {
                confirmUnloadButton.disabled = false;
            }

            unloadModal.style.display = 'block';

            confirmUnloadButton.onclick = () => {
                const selectedItems = Array.from(unloadListContainer.querySelectorAll('input[name="unload_item"]:checked'))
                                             .map(input => input.value);
                
                let unloadedCount = 0;
                
                selectedItems.forEach(uniqueId => {
                    const [type, mapName] = uniqueId.split('-');
                    
                    if (unloadMap(type, mapName)) {
                        unloadedCount++;
                    }
                });
                
                let infoMessage = "";
                if (unloadedCount === 0) {
                    infoMessage = "アンロード対象が選択されていないか、すでにアンロード済みです。";
                } else {
                    infoMessage = `合計 ${unloadedCount} 個の要素をアンロードしました。`;
                }
                
                document.getElementById('info').innerHTML = infoMessage;
                // アンロード後、現在のマップ名をクリアしても良いが、前回ロードしたマップ名として残しておく選択肢も
                // currentMapName = ""; // 必要に応じてコメントアウトを解除
                
                unloadModal.style.display = 'none';
            };
        }

        function init() {
            const container = document.getElementById('viewer-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333); 

            // 1. カメラのUpベクトルをZ軸に設定（必須）
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 5); 
            // Y軸ではなく、Z軸を「上」とする
            camera.up.set(0, 0, 1); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.minDistance = 0.5;
            controls.maxDistance = 100;
            
            // 2. controls.upもZ軸に設定（確実性のため）
            controls.target.set(0, 0, 0); 

            // 3. camera.up の変更を反映するためにコントロールを更新
            controls.update();

            loader = new PCDLoader();
            
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('load-map-button').addEventListener('click', startLoadProcess);
            document.getElementById('unload-map-button').addEventListener('click', startUnloadProcess);
            
            // --- 【空のビューア機能のための追加ロジック】 ---
            // Flaskから渡された map_name を取得（Jinja2テンプレート構文を使用）
            const initialMapName = "{{ map_name }}"; 
            
            if (initialMapName) {
                // map_name が指定されている場合（/view_map/<map_name> からの遷移）
                // 初期マップ名を設定し、ロード待ち状態のメッセージを表示
                currentMapName = initialMapName;
                document.getElementById('map-name-input').value = initialMapName;
                
                // 初回ロードを実行（データが既にテンプレートに含まれている場合もあるため）
                // テンプレート変数が存在するかチェック
                const hasInitialPCD = true; // /view_map/<map_name> のロジックではPCDは必須としていたため
                const hasInitialYAML = "{{ yaml_data|safe }}" !== "";
                const hasInitialWaypoints = "{{ waypoints_data|safe }}" !== "[]";
                
                if (hasInitialPCD || hasInitialYAML || hasInitialWaypoints) {
                    executeMapLoading(initialMapName, hasInitialPCD, hasInitialYAML, hasInitialWaypoints);
                } else {
                    document.getElementById('loading-message').textContent = `マップ: '${initialMapName}' のデータが見つかりません。ロードボタンから再試行してください。`;
                }

            } else {
                // map_name が空の場合（/map_viewer からの遷移）
                // ロードモーダルを自動的に開く
                document.getElementById('loading-message').textContent = "マップを選択してください。";
                startLoadProcess();
            }
            // --- 【追加ロジックここまで】 ---

            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
